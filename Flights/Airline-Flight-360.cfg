		type = string
		hidden = true

		loc_GAP_Airline_Flight_340_title_s1 = #loc_GAP_Airline_Flight_340_title_s1
		loc_GAP_Airline_Flight_340_description_s1 = #loc_GAP_Airline_Flight_340_description_s1
		loc_GAP_Airline_Flight_340_description_s2 = #loc_GAP_Airline_Flight_340_description_s2
		loc_GAP_shared_Flight_Completed_br_br_Snacks_served = #loc_GAP_shared_Flight_Completed_br_br_Snacks_served
		loc_GAP_shared_br_Air_sickness_bags_used = #loc_GAP_shared_br_Air_sickness_bags_used
		loc_GAP_Airline_Flight_340_completedMessage_s3 = #loc_GAP_Airline_Flight_340_completedMessage_s3
