			}
			
		}
		
		DIALOG_BOX
		{
			condition = PARAMETER_COMPLETED
			parameter = RequestLandingIsland
			
			position = CENTER
			
			TEXT
			{
				text = #loc_GAP_Airline_Flight_340_BEHAVIOUR3_DIALOG_BOX2_TEXT1_text

			}
			
			IMAGE
			{
				url = ContractConfigurator/ui/eva_ac_male
				characterName = #loc_GAP_shared_Air_Traffic_Control
			}
			
		}

		DIALOG_BOX
		{
