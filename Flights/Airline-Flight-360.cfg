		loc_GAP_shared_passengers = #loc_GAP_shared_passengers
		loc_GAP_shared_and_recover_all = #loc_GAP_shared_and_recover_all
	}


	sortKey = 51

REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = Airline-Flight-322
		minCount = 1

	}
	

	//DATA NODES TO PROCESS FOR CONTRACT USE

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		
		craft = GAPcraftAirlineFlight340
		
	}

//Passenger Data
	DATA
	{
		type = int
		
		numPassengers = Random(24, 84)
	
	}
	
	DATA
	{
		type = List<Kerbal>
		
		kerbals = NewKerbals(84).Random(@numPassengers)
		
		hidden = true
		
	}
	
//Snacks
	DATA
	{
		type = double
		
		numSnacks = Round(@numPassengers * 1.05)
		numAirSickness = Round(Random( 0 , @numPassengers / 6))
		
	}
	

//CONTRACT DESCRIPTION

	name = Airline-Flight-340
	title = @/loc_GAP_Airline_Flight_340_title_s1 + @/numPassengers
	genericTitle = #loc_GAP_Airline_Flight_340_genericTitle
	group = KSC Airlines
	agent = KSC Airlines

	description = @/loc_GAP_Airline_Flight_340_description_s1 + @/numPassengers + @/loc_GAP_Airline_Flight_340_description_s2
	
	genericDescription = #loc_GAP_Airline_Flight_340_genericDescription

	synopsis = #loc_GAP_Airline_Flight_340_synopsis

	notes = #loc_GAP_Airline_Flight_340_notes

	completedMessage = @/loc_GAP_shared_Flight_Completed_br_br_Snacks_served + @/numSnacks + @/loc_GAP_shared_br_Air_sickness_bags_used + @/numAirSickness + @/loc_GAP_Airline_Flight_340_completedMessage_s3

//Contract Limits
   	maxCompletions = 0
   	maxSimultaneous = 1
//	weight = 30.0

	autoAccept = false
	declinable = true
	cancellable = true

	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
   	targetBody = Kerbin

//Contract Rewards
  	advanceFunds = 50000.0
  	rewardFunds = @/numPassengers * 15000.0
  	rewardReputation = 1.0
 	rewardScience = 1.0

//Contract Penalties
  	failureFunds = @/numPassengers * 15000.0
 	failureReputation = 100.0


//BEHAVIOURS TO DO WHEN CREATING CONTRACT

	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbals
		
		kerbalType = Tourist
		
	}

	BEHAVIOUR
	{
        name = WaypointGenerator
        type = WaypointGenerator
		
		WAYPOINT
		{
			name = Dessert Airfield
			icon = marker
			
			underwater = false
			targetBody = Kerbin
			latitude = -6.52009127233
			longitude = -144.03940521399
			altitude = 20
			
		}
		
		PQS_CITY
		{
			name = #loc_GAP_shared_Island_Airfield
			icon = marker
			
			pqsCity = IslandAirfield
			pqsOffset = -129.870222771593, -227.36909617722, 25.4157831746222
			altitude = 50
			
		}
		
		PQS_CITY
		{
			name = #loc_GAP_shared_KSC_Air_Terminal
			icon = marker
			
			pqsCity = KSC
			pqsOffset = -397.673310011714, 367.567136523425, 25.0483683246694
			altitude = 20
			parameter = RequestLandingKSC
			
		}
		
	
	}
	
	BEHAVIOUR
	{
		name = DialogBox
		type = DialogBox
		
