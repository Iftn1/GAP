//Wright-Bail - Wright Aeronautical: Jump from an airplane!

CONTRACT_TYPE
{

	sortKey = e1

//REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = Wright-2500m
		minCount = 1
		
	}
	

//DATA NODES TO PROCESS FOR CONTRACT USE

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		
		craft = GAPcraftWrightBail
		craftJumper1 = GAPcraftJumper1WrightBail
		
	}
	

//CONTRACT DESCRIPTION

//Contract Descriptions
	name = Wright-Bail
	title = #loc_GAP_Wright_Bail_title
	group = GAP
	agent = Wright Aeronautical
	
	description = #loc_GAP_Wright_Bail_description
	
	synopsis = #loc_GAP_Wright_Bail_synopsis
	
	notes = #loc_GAP_Wright_Bail_notes
	
	completedMessage = #loc_GAP_Wright_Bail_completedMessage

//Contract Limits
  	maxCompletions = 1
   	maxSimultaneous = 1
//	weight = 10.0

	autoAccept = false
	declinable = true
	cancellable = true
	
	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0
 
//Contract Reward Modifiers
	prestige = Trivial
   	targetBody = Kerbin

//Contract Rewards
  	advanceFunds = 2000
  	rewardFunds = 12000
  	rewardReputation = 20.0
 	rewardScience = 3.0

//Contract Penalties
  	failureFunds = 4000.0
 	failureReputation = 5.0
	
	
//PARAMETERS FOR CONTRACT COMPLETION

//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_shared_Your_aircraft_must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = #loc_GAP_shared_have_a_certified_pilot
			
			trait = Pilot
			minCrew = 1
		
			disableOnStateChange = false
			hideChildren = true

		}
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = #loc_GAP_Wright_Bail_PARAMETER1_PARAMETER2_title_2
			
			minCrew = 1
		
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = #loc_GAP_shared_have_wings
			
			category = Aero
			
			disableOnStateChange = false
			hideChildren = true

		}
		
		PARAMETER
		{
			name = PreFlightCheck
			type = All
			title = #loc_GAP_shared_complete_all_pre_flight_checks
		
			PARAMETER
			{
				name = ReachState
				type = ReachState
				title = #loc_GAP_shared_remain_stationary_on_the_runway
				
				targetBody = Kerbin
				biome = Runway
				maxSpeed = 0.1

				completeInSequence = true
				disableOnStateChange = false
				hideChildren = true
				
			}
			
			PARAMETER
			{
				name = RegisterFlightPlan
				type = Duration
				
				duration = 10s
				preWaitText = #loc_GAP_shared_review_checklist
				waitingText = #loc_GAP_shared_registering_flight_plan
				completionText = #loc_GAP_shared_flight_plan_registered

				completeInSequence = true
				disableOnStateChange = true
				
			}
			
			PARAMETER
			{
				name = RequestTakeoffKSC
				type = Duration
				
				duration = 10s
				preWaitText = #loc_GAP_shared_request_clearance_for_takeoff_bd93
				waitingText = #loc_GAP_shared_requesting_clearance_for_take_eb24
				completionText = #loc_GAP_shared_be_cleared_for_takeoff

				completeInSequence = true
				disableOnStateChange = true
				
			}
			
			completeInSequence = true
			disableOnStateChange = true
			
		}
		
		disableOnStateChange = false

	}

//Contract Goals
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_Wright_Bail_PARAMETER2_title_2
		
		vessel = @/craft
		
		PARAMETER
		{
			name = ReachState
			type = ReachState
			
			targetBody = Kerbin
			situation = FLYING
			minAltitude = 2500

			disableOnStateChange = true
			hideChildren = true
			hidden = true
			
		}
	
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true	

	}
	
//Skydive
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_Wright_Bail_PARAMETER3_title_3
		
		define = @/craftJumper1
		dissassociateVesselsOnContractCompletion = true
		
		PARAMETER
		{
			name = ReachState
			type = ReachState
			
			targetBody = Kerbin
			situation = FLYING
			minAltitude = 2000

			disableOnStateChange = true
			hideChildren = true
			hidden = true
			
		}
		
		PARAMETER
		{
			name = VesselIsType
			type = VesselIsType
			
			vesselType = EVA

			hideChildren = true
			hidden = true
			
		}
		
		PARAMETER
		{
			name = IsNotVessel
			type = IsNotVessel
			
			vessel = @/craft

			hideChildren = true
			hidden = true
			
		}
	
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true	

	}
	
//Skydive - Landing
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_Wright_Bail_PARAMETER4_title_4
		
		vessel = @/craftJumper1
		
		PARAMETER
		{
			name = Any
			type = Any
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Kerbin
				situation = LANDED

				hideChildren = true
				hidden = true
				
			}
			
			PARAMETER
			{
				name = ReachState
				type = ReachState
				
				targetBody = Kerbin
				situation = SPLASHED

				hideChildren = true
				hidden = true
				
			}
			
			hideChildren = true
			hidden = true
		
		}
		
		PARAMETER
		{
			name = VesselIsType
			type = VesselIsType
			
			vesselType = EVA
			
			hideChildren = true
			hidden = true
			
		}
		
		PARAMETER
		{
			name = IsNotVessel
			type = IsNotVessel
			
			vessel = @/craft
			
			hideChildren = true
			hidden = true
			
		}

		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = #loc_GAP_Wright_Bail_PARAMETER4_PARAMETER4_title
			
			vessel = @/craft
			
			hideChildren = true	
			hidden = true

		}
		
		completeInSequence = true
		disableOnStateChange = true
		hideChildren = true	

	}

//Recovery Parameter - Landing
	PARAMETER
	{
		name = Any
		type = Any
		title = #loc_GAP_Wright_Bail_PARAMETER5_title_5
		
		PARAMETER
		{
			name = Any
			type = Any
			title = #loc_GAP_shared_at_one_of_the_following_recovery_areas

			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = #loc_GAP_shared_the_KSC_Runway
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = Runway
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}

				disableOnStateChange = false
				hideChildren = true		

			}
			
			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = #loc_GAP_shared_or_the_Spaceplane_Hangar_Air_Terminal
				
				vessel = @/craft

			PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = SPH
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}
				
				disableOnStateChange = false
				hideChildren = true		

			}
		
			disableOnStateChange = false
		
		}
		
		completeInSequence = true
		disableOnStateChange = false

	}

//Recovery Parameter - Craft & Kerbal Safety Check
	PARAMETER
	{
		name = All
		type = All
		title = #loc_GAP_shared_safely
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = #loc_GAP_shared_without_destroying_your_aircraft
			
			vessel = @/craft

		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = #loc_GAP_shared_or_killing_anyone
			
			vessel = @/craft

		}

		completeInSequence = true
		disableOnStateChange = true

	}	
	
}