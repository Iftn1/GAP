//Wright-BarnstormIsland - Wright Aeronautical: Barnstorm the Island Airfield hangars!

CONTRACT_TYPE
{

	sortKey = d2

REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		
		contractType = Wright-FirstFlight
		minCount = 1

	}

	
//DATA NODES TO PROCESS FOR CONTRACT USE

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		
		craft = GAPcraftWrightBarnstormIsland
		
	}
	
	
//CONTRACT DESCRIPTION

	name = Wright-BarnstormIsland
	title = #loc_GAP_Wright_BarnstormIsland_title
	group = GAP
	agent = Wright Aeronautical
	
	description = #loc_GAP_Wright_BarnstormIsland_description
	
	synopsis = #loc_GAP_Wright_BarnstormIsland_synopsis
	
	notes = #loc_GAP_Wright_BarnstormIsland_notes
	
	completedMessage = #loc_GAP_Wright_BarnstormIsland_completedMessage

//Contract Limits
	maxCompletions = 0
   	maxSimultaneous = 1
//	weight = 5.0

	autoAccept = false
	declinable = true
	cancellable = true

	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0

//Contract Reward Modifiers
 	prestige = Trivial
   	targetBody = Kerbin

//Contract Rewards
  	advanceFunds = 0.0
  	rewardFunds = 0.0
  	rewardReputation = 20.0
	rewardScience = 0.0

//Contract Penalties
  	failureFunds = 2000.0
 	failureReputation = 20.0
	

//BEHAVIOURS TO DO WHEN CREATING CONTRACT

	BEHAVIOUR
	{
		name = WaypointGenerator
		type = WaypointGenerator

		PQS_CITY
		{
			name = #loc_GAP_PQS_CITY_Hangar_1_name
			icon = marker
			
			pqsCity = IslandAirfield
			pqsOffset = -90.539976048718, -113.331904841847, 40.0745121937252			
			altitude = 20
			
		}
		
		PQS_CITY
		{
			name = #loc_GAP_PQS_CITY_Hangar_2_name_2
			icon = marker
			
			pqsCity = IslandAirfield
			pqsOffset = -177.424400344843, -96.5529370794093, 40.0744976471569
			altitude = 20
			
		}
		
	}

	
//PARAMETERS FOR CONTRACT COMPLETION

//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_shared_Your_aircraft_must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = #loc_GAP_shared_have_a_pilot
		
			minCrew = 1
		
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = #loc_GAP_shared_have_wings
			
			category = Aero
			
			disableOnStateChange = false
			hideChildren = true

		}
		
		PARAMETER
		{
			name = PreFlightCheck
			type = All
			title = #loc_GAP_shared_complete_all_pre_flight_checks
		
			PARAMETER
			{
				name = ReachState
				type = ReachState
				title = #loc_GAP_shared_remain_stationary_on_the_runway
				
				targetBody = Kerbin
				biome = Runway
				maxSpeed = 0.1

				completeInSequence = true
				disableOnStateChange = false
				hideChildren = true
				
			}
			
			PARAMETER
			{
				name = RegisterFlightPlan
				type = Duration
				
				duration = 10s
				preWaitText = #loc_GAP_shared_review_checklist
				waitingText = #loc_GAP_shared_registering_flight_plan
				completionText = #loc_GAP_shared_flight_plan_registered

				completeInSequence = true
				disableOnStateChange = true
				
			}
			
			PARAMETER
			{
				name = RequestTakeoffKSC
				type = Duration
				
				duration = 10s
				preWaitText = #loc_GAP_shared_request_clearance_for_takeoff_bd93
				waitingText = #loc_GAP_shared_requesting_clearance_for_take_eb24
				completionText = #loc_GAP_shared_be_cleared_for_takeoff

				completeInSequence = true
				disableOnStateChange = true
				
			}
			
			completeInSequence = true
			disableOnStateChange = true
			
		}
		
		disableOnStateChange = false

	}

//Contract Goals
//Barnstorm the Following
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_Wright_BarnstormIsland_PARAMETER2_title_2
		
		vessel = @/craft
		
		PARAMETER
		{
			name = ReachState
			type = ReachState
			
			situation = FLYING
			minSpeed = 3.0				
			maxAltitude = 154
			
			completeInSequence = true
			hideChildren = true
			
		}
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 0
			
			distance = 22
			hideOnCompletion = true
			
			disableOnStateChange = true
			hideChildren = true
			
		}
		
		hideChildren = true
	
	}
	
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_Wright_BarnstormIsland_PARAMETER3_title_3
		
		vessel = @/craft
		
		rewardReputation = 40

		PARAMETER
		{
			name = ReachState
			type = ReachState
			
			situation = FLYING
			minSpeed = 3.0
			maxAltitude = 154
			
			completeInSequence = true
			hideChildren = true
			
		}
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			index = 1
			
			distance = 22
			hideOnCompletion = true
			
			disableOnStateChange = true
			hideChildren = true
			
		}
		
		optional = true
		hideChildren = true
	
	}

//Recovery Parameter - Landing
	PARAMETER
	{
		name = VesselParameterGroupBarnstormFinish
		type = VesselParameterGroup
		title = #loc_GAP_shared_and_then_land_and_stop_anywhere
		
		vessel = @/craft

		PARAMETER
		{
			name = ReachState
			type = ReachState
			
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			
			disableOnStateChange = false
			hideChildren = true

		}
	
		disableOnStateChange = false
		completeInSequence = true
		hideChildren = true
	
	}

//Recovery Parameter - Craft & Kerbal Safety Check
	PARAMETER
	{
		name = All
		type = All
		title = #loc_GAP_shared_safely
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = #loc_GAP_shared_without_destroying_your_aircraft
			
			vessel = @/craft

		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = #loc_GAP_shared_or_killing_anyone
			
			vessel = @/craft

		}
		
		completeInSequence = true
		disableOnStateChange = true

	}
	
}