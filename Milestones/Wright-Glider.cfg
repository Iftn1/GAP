//Wright-Glider - Wright Aeronautical: Build and fly a glider!

CONTRACT_TYPE
{

	sortKey = a1

//REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		
		part = seatExternalCmd
	
	}

	
	REQUIREMENT
	{
		name = Any
		type = Any

		REQUIREMENT
		{
			name = PartModuleUnlocked
			type = PartModuleUnlocked
			
			partModule = ModuleControlSurface

		}
		
		REQUIREMENT:NEEDS[AtmosphereAutopilot]
		{
		name = PartModuleUnlocked
		type = PartModuleUnlocked
		partModule = SyncModuleControlSurface
		}
		
		REQUIREMENT:NEEDS[FerramAerospaceResearch]
		{
			name = PartModuleUnlocked
			type = PartModuleUnlocked
			
			partModule = FARControllableSurface

		}
		
		REQUIREMENT:NEEDS[Firespitter]
		{
			name = PartModuleUnlocked
			type = PartModuleUnlocked
			
			partModule = FSliftSurface

		}
		
		REQUIREMENT:NEEDS[Firespitter]
		{
			name = PartModuleUnlocked
			type = PartModuleUnlocked
			
			partModule = FSwing

		}

	}


//DATA NODES TO PROCESS FOR CONTRACT USE

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		
		craft = GAPcraftWrightGlider
		
	}
	

//CONTRACT DESCRIPTION

	name = Wright-Glider
	title = #loc_GAP_Wright_Glider_title
	group = GAP
	agent = Wright Aeronautical

	description = #loc_GAP_Wright_Glider_description

	synopsis = #loc_GAP_Wright_Glider_synopsis

	notes = #loc_GAP_Wright_Glider_notes

	completedMessage = #loc_GAP_Wright_Glider_completedMessage
	
//Contract Limits
   	maxCompletions = 1
   	maxSimultaneous = 1
//	weight = 150.0
	
	autoAccept = false
	declinable = true
	cancellable = true
	
	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0
	
//Contract Reward Modifiers
	prestige = Trivial
   	targetBody = Kerbin
	
//Contract Rewards
  	advanceFunds = 2000.0
  	rewardFunds = 3000.0
  	rewardReputation = 5.0
 	rewardScience = 5.0

//Contract Penalties
  	failureFunds = 2000.0
 	failureReputation = 5.0
	

//PARAMETERS FOR CONTRACT COMPLETION

//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_Wright_Glider_PARAMETER1_title
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true
		
		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = #loc_GAP_shared_have_a_volunteer
		
			minCrew = 1
		
			disableOnStateChange = false
			hideChildren = true

		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = #loc_GAP_Wright_Glider_PARAMETER1_PARAMETER2_title_2
			
			part = seatExternalCmd			

			disableOnStateChange = false
			hideChildren = true

		}
		
		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			title = #loc_GAP_shared_have_wings
			
			category = Aero
			
			disableOnStateChange = false
			hideChildren = true

		}
		
		PARAMETER
		{
			name = All
			type = All
			
			title = #loc_GAP_Wright_Glider_PARAMETER1_PARAMETER4_title_4
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation

				NONE
				{
					MODULE
					{
						name = ModuleEngines
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation

				NONE
				{
					MODULE
					{
						name = ModuleEnginesFX
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
			
			PARAMETER:NEEDS[Firespitter]
			{
				name = PartValidation
				type = PartValidation

				NONE
				{
					MODULE
					{
						name = FSengine
						
					}
					
				}
				
				disableOnStateChange = false
				hideChildren = true
				hidden = true
				
			}
			
			disableOnStateChange = false
			hideChildren = true
			
		}
		
		disableOnStateChange = false

	}

//Contract Goals
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_shared_get_airborne
		
		vessel = @/craft
		
		PARAMETER
		{
			name = ReachState
			type = ReachState

			targetBody = Kerbin		
			situation = FLYING
			minSpeed = 15
			
			completeInSequence = true
			disableOnStateChange = true
			hideChildren = true

		}
	
		completeInSequence = true
		hideChildren = true
	
	}

//Recovery Parameter - Landing
	PARAMETER
	{
		name = WrightLand
		type = VesselParameterGroup
		title = #loc_GAP_shared_and_then_land_and_stop_anywhere
		
		vessel = @/craft

		PARAMETER
		{
			name = ReachState
			type = ReachState
			
			targetBody = Kerbin
			situation = LANDED
			maxSpeed = 0.0
			
			disableOnStateChange = false
			hideChildren = true

		}
	
		completeInSequence = true
		hideChildren = true
	
	}

//Recovery Parameter - Craft & Kerbal Safety Check
	PARAMETER
	{
		name = All
		type = All
		title = #loc_GAP_shared_safely
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = #loc_GAP_shared_without_destroying_your_flying_machine
			
			vessel = @/craft

		}
		
		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = #loc_GAP_shared_or_killing_anyone
			
			vessel = @/craft

		}
		
		completeInSequence = true
		disableOnStateChange = true
		
	}
	
}