		//==================== Stunts/Wright-BarnstormRD.cfg ====================

		// EN: Barnstorm the R&D Center!
		#loc_GAP_Wright_BarnstormRD_title = 在研发中心进行特技飞行！
		// EN: Barnstorm the R&D Center bridge and tunnel? Jebediah thinks it can be done. Gene has signed off on …
		#loc_GAP_Wright_BarnstormRD_description = 在研发中心的人行桥和隧道里进行特技飞行？Jebediah 觉得这能行。Gene 已经批准了这次尝试。莱特航空认为这说不定哪天能促成一场飞行表演。至少眼下，摄像机不会开机，以防……呃……你懂的。因此，为了规避责任，这完全是一次自筹资金的冒险，但如果你把这两项都完成，你将获得相当可观的声望和飞行员经验。
		// EN: Go barnstorm the R&D pedestrian bridge. Earn a bonus reputation if you can barnstorm the tunnel too.
		#loc_GAP_Wright_BarnstormRD_synopsis = 去研发中心人行桥进行特技飞行。如果你还能在隧道里也来一次特技飞行，可获得额外声望奖励。
		// EN: Be sure your pilot signs off on the insurance waiver before attempting this one, as it's not covere…
		#loc_GAP_Wright_BarnstormRD_notes = 尝试这项特技前，务必让你的飞行员签署保险免责声明，因为这项是不在保险范围内的。
		// EN: Wow! You did it! Those who saw it were impressed. Well done! Gene says if you ever get tired of doi…
		#loc_GAP_Wright_BarnstormRD_completedMessage = 哇！你做到了！看到的人都很佩服。干得漂亮！Gene 说，如果你哪天做特技做腻了，只要你有兴趣，任务控制中心还有一些重要的活儿等着你。
