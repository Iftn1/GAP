		//==================== Milestones/GAP-Helicopter.cfg ====================

		// EN: Land on a helipad!
		#loc_GAP_GAP_Helicopter_title = 在直升机坪上降落！
		// EN: We want you to test your first helicopter or Vertical Take-Off and Landing (VTOL) prototype. Land o…
		#loc_GAP_GAP_Helicopter_description = 我们想让你测试你的第一架直升机或垂直起降（VTOL）原型机。在现有的直升机坪之一降落。
		// EN: For science (and a few funds)!
		#loc_GAP_GAP_Helicopter_synopsis = 为了科学（还有一点资金）！
		// EN: Make a helicopter or VTOL and land on a VAB or Administration Building helipad!
		#loc_GAP_GAP_Helicopter_notes = 造一架直升机或垂直起降飞行器，然后在飞行器组装大楼或管理大厦的直升机坪上降落！
		// EN: Flight Completed! And you're still alive, which is even better since most helicopter and other VTOL…
		#loc_GAP_GAP_Helicopter_completedMessage = 飞行完成！而且你还活着——这更值得庆幸，因为大多数直升机和其他垂直起降试飞都是致命的。
		// EN: land on a helipad
		#loc_GAP_GAP_Helicopter_PARAMETER2_title_2 = 在直升机坪上降落
		// EN: at either
		#loc_GAP_GAP_Helicopter_PARAMETER2_PARAMETER1_title = 在以下任一处
		// EN: or the Administration Building Helipad
		#loc_GAP_GAP_Helicopter_PARAMETER2_PARAMETER1_PARAMETER2_title_2 = 或管理大厦直升机坪

		//==================== Milestones/GAP-Seaplane.cfg ====================

		// EN: Build and fly a seaplane!
		#loc_GAP_GAP_Seaplane_title = 建造并驾驶一架水上飞机！
		// EN: You've proven the airworthiness of your aircraft so far. But can you modify it or design an aircraf…
		#loc_GAP_GAP_Seaplane_description = 到目前为止，你已经证明了自己飞机的适航性。但你能否改装它，或设计一架能在水面上降落的飞机？我们希望你尝试一项航空史上的首创——让飞机降落在水面上，然后再重新起飞。我们的工程师想给这样的设想取名叫水上飞机，他们认为如果这一设想能被证实，它对 KSC 的许多机构都会非常有用。
		// EN: Land a seaplane on the surface of the water at the waypoint, and take off again and land back at KS…
		#loc_GAP_GAP_Seaplane_synopsis = 驾驶水上飞机在导航点的水面上降落，然后再次起飞并返回 KSC 降落。
		// EN: Your craft must be an airplane that can land on water horizontally and take off again.
		#loc_GAP_GAP_Seaplane_notes = 你的飞行器必须是一架能水平降落在水面上并再次起飞的飞机。
		// EN: Congratulations on another aviation first! You have propelled your organization to one of the most …
		#loc_GAP_GAP_Seaplane_completedMessage = 恭喜你又完成了一项航空史上的首创！你把自己的机构推上了 Kerbin 最受欢迎的机构之列。GAP 已将多位投资者提供的一笔资金计入你的账户，他们都看好你的机构的未来。
		// EN: Your seaplane must
		#loc_GAP_GAP_Seaplane_PARAMETER1_title = 你的水上飞机必须
		// EN: land on water
		#loc_GAP_GAP_Seaplane_PARAMETER2_title_2 = 降落在水面上
		// EN: and slow to 3.0 m/s or less
		#loc_GAP_GAP_Seaplane_PARAMETER3_title_3 = 然后减速到 3.0 m/s 或更低
		// EN: and then go at least 20.0 m/s on water
		#loc_GAP_GAP_Seaplane_PARAMETER4_title_4 = 然后在水中达到至少 20.0 m/s
		// EN: and then get airborne
		#loc_GAP_GAP_Seaplane_PARAMETER5_title_5 = 然后升空

		//==================== Milestones/SSI-10000m.cfg ====================

		// EN: Fly an airplane to 10,000m.
		#loc_GAP_SSI_10000m_title = 驾驶飞机飞到 10,000m。
		// EN: Inigma Kerman of SSI wants you to design and fly an aircraft capable of operating at an altitude of…
		#loc_GAP_SSI_10000m_description = SSI 的 Inigma Kerman 希望你设计并驾驶一架能在 10,000m 高度飞行的飞机。他说，这样的成就会让未来的航空旅行更加安全，因为 Kerbin 上大多数恶劣天气都只发生在这个高度以下。他说，如果飞行员能直接飞越恶劣天气，而不是从中穿过，就能开启大量区域乃至全球航空旅行的可能性。
		// EN: Simply launch an airplane from the runway, fly up to 10,000m, then land back at KSC safely.
		#loc_GAP_SSI_10000m_synopsis = 只需从跑道起飞一架飞机，爬升到 10,000m，然后安全返回 KSC 降落。
		// EN: Enjoy the view, as at this altitude the clouds (if any are seen today) will mostly be below your ai…
		#loc_GAP_SSI_10000m_notes = 好好欣赏风景吧，在这个高度上，云层（如果今天能看到的话）大多会在你的飞机下方！
		// EN: You did it! 10,000m reached, and your pilot snapped a great picture!\n\nWhile your pilot rests up a…
		#loc_GAP_SSI_10000m_completedMessage = 你做到了！抵达 10,000m，你的飞行员还拍下了一张很棒的照片！\n\n趁你的飞行员在宇航员中心休息时，如果有兴趣，记得去任务控制中心找 Gene 了解另一个 SSI 的机会。
		// EN: fly up to 10,000m
		#loc_GAP_SSI_10000m_PARAMETER2_title_2 = 飞到 10,000m

		//==================== Milestones/SSI-20000m.cfg ====================

		// EN: Fly an airplane to 20,000m.
		#loc_GAP_SSI_20000m_title = 驾驶飞机飞到 20,000m。
		// EN: Maculator Kerman has another challenge for you, this time one that could very well unlock opportuni…
		#loc_GAP_SSI_20000m_description = Maculator Kerman 又给你带来了一个新挑战，这一次很有可能开启常态化全球航空旅行的机会——达到 20,000m 的飞行高度。他说，实现这样的飞行高度将证明，就连 Kerbin 上最高的山峰也能被飞越，这将让 Kerbin 上几乎任何目的地都可以通过航空抵达！
		// EN: Simply launch an airplane from the runway, fly up to 20,000m, then land back at KSC safely.
		#loc_GAP_SSI_20000m_synopsis = 只需从跑道起飞一架飞机，爬升到 20,000m，然后安全降回 KSC。
		// EN: Enjoy the view, as at this altitude the curvature of Kerbin will be clearly visible!
		#loc_GAP_SSI_20000m_notes = 好好欣赏风景吧，在这个高度上，Kerbin 的弧度清晰可见！
		// EN: You did it! 20,000m reached!\n\nA number of opportunities have opened up now that global air travel…
		#loc_GAP_SSI_20000m_completedMessage = 你做到了！达到 20,000m！\n\n全球航空旅行已近在咫尺，许多新的机会也随之开启。回任务控制中心看看有什么新合同吧！
		// EN: fly up to 20,000m
		#loc_GAP_SSI_20000m_PARAMETER2_title_2 = 飞到 20,000m

		//==================== Milestones/SSI-35000m.cfg ====================

		// EN: Fly an airplane to 35,000m.
		#loc_GAP_SSI_35000m_title = 驾驶飞机飞到 35,000m。
		// EN: SSI Aerospace and the Kerbal Space Program have selected your organization to receive special fundi…
		#loc_GAP_SSI_35000m_description = SSI 航天与坎巴拉太空计划已选定你的机构，为其提供专项资金，用来设计并试飞一架能抵达 35,000m 高空大气层的飞机。Inigma Kerman 解释说，完成这一壮举将开启令人兴奋的航天飞机研发新前沿！
		// EN: Simply launch an airplane from the runway, fly up to 35,000m, then land back at KSC safely.
		#loc_GAP_SSI_35000m_synopsis = 只需从跑道起飞一架飞机，爬升到 35,000m，然后安全降回 KSC。
		// EN: Enjoy the view, as at this altitude you will feel as if you are touching the very boundary of space!
		#loc_GAP_SSI_35000m_notes = 好好欣赏风景吧，在这个高度上，你会觉得自己正触及太空的边缘！
		// EN: You did it! 35,000m reached! The air was really thin up there, wasn't it? No worries, we have fresh…
		#loc_GAP_SSI_35000m_completedMessage = 你做到了！达到 35,000m！上面的空气可真稀薄，对吧？别担心，任务控制中心这边有新鲜空气。\n\n干得漂亮！航天飞机的新前沿已经打开！
		// EN: fly up to 35,000m
		#loc_GAP_SSI_35000m_PARAMETER2_title_2 = 飞到 35,000m

		//==================== Milestones/SSI-60000m.cfg ====================

		// EN: Fly a spaceplane to the edge of space!
		#loc_GAP_SSI_60000m_title = 驾驶航天飞机飞到太空边缘！
		// EN: The Kerbal Space Program wants SSI Aerospace to be the first to develop a spaceplane for use in its…
		#loc_GAP_SSI_60000m_description = 坎巴拉太空计划希望 SSI 航天成为首家为其太空计划研制航天飞机的机构。Inigma Kerman 早就把你设成了快捷拨号，现在正请你的机构牵头这项前沿工作。\n\nInigma 说，你需要研制一架航天飞机——它要能飞到大气层最高处，并能安全降落地面。可以说，60,000m 距离太空不过一步之遥。他说，坎巴拉太空计划已经批准：只要你愿意，这次飞行可以做成亚轨道飞行——前提是你的航天飞机设计得出来，不过完成任务并不要求这么做。
		// EN: Simply launch a spaceplane from the runway and fly up to 60,000m and then land your spaceplane anyw…
		#loc_GAP_SSI_60000m_synopsis = 只需从跑道起飞一架航天飞机，爬升到 60,000m，然后让航天飞机安全降落在任意地面上。你可以使用吸气式发动机、液体燃料发动机，或两者兼用。
		// EN: High above Kerbin, where space meets the air, and the stars beckon, will you realize that the unive…
		#loc_GAP_SSI_60000m_notes = 在 Kerbin 的高空之上，太空与大气在此交汇，群星在向你招手，你会意识到宇宙就在指尖。当然，前提是坎巴拉人除了大拇指之外还有别的手指。
		// EN: Your spaceplane mission was a success! Mission Control erupted in celebration when you flew above 6…
		#loc_GAP_SSI_60000m_completedMessage = 你的航天飞机任务圆满成功！当你飞到 60,000m 以上时，任务控制中心一片欢腾；你着陆时，他们再次欢呼。赞美之词从四面八方涌来，你的机构也获得了一笔相当丰厚的奖励。
		// EN: fly up to 60,000m
		#loc_GAP_SSI_60000m_PARAMETER2_title_2 = 飞到 60,000m

		//==================== Milestones/SSI-Mach1.cfg ====================

		// EN: Break the sound barrier!
		#loc_GAP_SSI_Mach1_title = 突破音障！
		// EN: SSI Aerospace's chief scientist Mach Kerman, and KSP retired test pilot Yeager Kerman, want to push…
		#loc_GAP_SSI_Mach1_description = SSI 航天的首席科学家 Mach Kerman 和 KSP 退役试飞员 Yeager Kerman 希望推动 SSI 迈向航天飞机研发。但在那之前，SSI 的 Inigma Kerman 说他们得先掌握超音速飞行；为此，他请你的机构设计一架能在 20,000m 以下平飞突破音障的飞机。\n\n虽然完成这项挑战并不要求如此，但 Mach Kerman 相信，如果你设计飞机时用上那款正为太空计划研制的新型液体燃料火箭发动机，这次尝试或许会更容易成功。
		// EN: Launch an airplane from the runway, fly between 2,500m and 20,000m, exceed 343 m/s in level flight …
		#loc_GAP_SSI_Mach1_synopsis = 从跑道起飞一架飞机，在 2,500m 到 20,000m 之间飞行，平飞超过 343 m/s 并保持 5 秒，然后安全降回 KSC。
		// EN: No one has ever gone faster than the speed of sound before, so most scientists and engineers are at…
		#loc_GAP_SSI_Mach1_notes = 以前从没有人飞得比音速还快，所以大多数科学家和工程师都不知道该给你什么有用的建议。就算他们有建议，他们也担心你飞得太快，根本听不见。
		// EN: You have broken the sound barrier and achieved the amazing speed of Mach 1! Don't worry, we're sure…
		#loc_GAP_SSI_Mach1_completedMessage = 你突破了音障，达到了惊人的马赫 1！别担心，我们相信它很快就能修好，交给下一个人用！
		// EN: break the sound barrier
		#loc_GAP_SSI_Mach1_PARAMETER2_title_2 = 突破音障
		// EN: fly faster than 343 m/s
		#loc_GAP_SSI_Mach1_PARAMETER2_PARAMETER2_title_2 = 以超过 343 m/s 的速度飞行

		//==================== Milestones/SSI-Mach2.cfg ====================

		// EN: Achieve Mach 2!
		#loc_GAP_SSI_Mach2_title = 达到马赫 2！
		// EN: Mach Kerman believes with current liquid-fueled rocket technology, that it's possible to exceed Mac…
		#loc_GAP_SSI_Mach2_description = Mach Kerman 认为，以现有的液体燃料火箭技术，超越马赫 2（也就是两倍音速）是有可能的。做到这一点，就能让 SSI 朝航天飞机的研发再迈进一步。他希望你把飞机飞到 2,500m 以上、20,000m 以下，看看你能否在受控的平飞中安全超越马赫 2。
		// EN: Launch an airplane from the runway, fly between 2,500m and 20,000m, exceed 686 m/s in level flight …
		#loc_GAP_SSI_Mach2_synopsis = 从跑道起飞一架飞机，在 2,500m 至 20,000m 之间飞行，以平飞状态超过 686 m/s 并保持 5 秒，然后安全降回 KSC。
		// EN: Going Mach 1 was cool. Going Mach 2 will be even cooler. Unfortunately, scientists at SSI and at KS…
		#loc_GAP_SSI_Mach2_notes = 飞马赫 1 很酷。飞马赫 2 会更酷。可惜，SSI 和 KSC 的科学家都预测，等你回来时要签的名也会翻倍。
		// EN: Wow! You did it! You reached Mach 2, and came back safely!\n\nInigma passed your flight data to Gen…
		#loc_GAP_SSI_Mach2_completedMessage = 哇！你做到了！你达到了马赫 2，还安全返航了！\n\nInigma 把你的飞行数据交给了坎巴拉太空计划的 Gene Kerman，Gene 说他为你的成就感到非常骄傲，也非常高兴看到你和 SSI 航天携手合作。
		// EN: achieve Mach 2
		#loc_GAP_SSI_Mach2_PARAMETER2_title_2 = 达到马赫 2
		// EN: fly faster than 686 m/s
		#loc_GAP_SSI_Mach2_PARAMETER2_PARAMETER2_title_2 = 以超过 686 m/s 的速度飞行

		//==================== Milestones/SSI-Mach3.cfg ====================

		// EN: Achieve Mach 3!
		#loc_GAP_SSI_Mach3_title = 达到马赫 3！
		// EN: Gene Kerman wants SSI to develop supersonic aircraft for use by the space program. Inigma Kerman wa…
		#loc_GAP_SSI_Mach3_description = Gene Kerman 希望 SSI 为太空计划研发超音速飞机。Inigma Kerman 想借此机会朝航天飞机的研发再迈进一步，并用 SSI 的又一次成功打动 Gene。因此，Inigma 请你的机构尝试一次超越马赫 3 的超音速试飞：把飞机飞到 2,500m 以上、25,000m 以下，在平稳、受控的飞行中安全超越马赫 3。Mach Kerman 已通知 SSI，这并不容易，因为在这个速度下预计会出现热效应；但 SSI 的每个人都相信，这一里程碑对航天飞机的研发是必要的——要成功，航天飞机就得飞得比马赫 3 快得多。
		// EN: Launch an airplane from the runway, fly between 2,500m and 25,000m, exceed 1029 m/s in level flight…
		#loc_GAP_SSI_Mach3_synopsis = 从跑道起飞一架飞机，在 2,500m 至 25,000m 之间飞行，以平飞状态超过 1029 m/s 并保持 5 秒，然后安全降回 KSC。
		// EN: Mach 3 is definitely not cool. IN fact, it's the threshold of the flames of fire. The aerodynamic f…
		#loc_GAP_SSI_Mach3_notes = 马赫 3 绝对不酷。事实上，那是烈焰的门槛。撕扯你飞机的气动力会毫不留情，也绝不宽容。派一位勇敢的飞行员去，你清楚他在飞行中能保持冷静。
		// EN: Incredible! You have achieved Mach 3!\n\nInigma Kerman says this flight brings the spaceplane progr…
		#loc_GAP_SSI_Mach3_completedMessage = 难以置信！你达到了马赫 3！\n\nInigma Kerman 说，这次飞行让航天飞机计划朝现实迈出了关键的一步，同时还带来了坎巴拉太空计划提供的一笔可观的资金，他们将受益于你的飞行数据。
		// EN: achieve Mach 3
		#loc_GAP_SSI_Mach3_PARAMETER2_title_2 = 达到马赫 3
		// EN: fly between 2500m and 25,000m
		#loc_GAP_SSI_Mach3_PARAMETER2_PARAMETER1_title = 在 2500m 至 25,000m 之间飞行
		// EN: fly faster than 1029 m/s
		#loc_GAP_SSI_Mach3_PARAMETER2_PARAMETER2_title_2 = 以超过 1029 m/s 的速度飞行

		//==================== Milestones/SSI-Mach4.cfg ====================

		// EN: Achieve Mach 4!
		#loc_GAP_SSI_Mach4_title = 达到马赫 4！
		// EN: Gene Kerman wants to see if SSI Aerospace and your organization can pull off the final leg of the a…
		#loc_GAP_SSI_Mach4_description = Gene Kerman 想看看 SSI 航天和你的机构能否完成空速计划的最后一段，并为飞机热效应以及飞机在高超音速下的操纵性收集数据。多快？马赫 4。Inigma Kerman 告诉 Gene，SSI 及其伙伴做得到。他希望你们接下这最后一项空速挑战，看看能否让飞机在 2,500m 以上、35,000m 以下以平飞达到马赫 4。如果能做到，那就为不久后研发航天飞机原型机打开了大门。
		// EN: Launch an airplane from the runway, fly between 2,500m and 25,000m, exceed 1372 m/s in level flight…
		#loc_GAP_SSI_Mach4_synopsis = 从跑道起飞一架飞机，在 2,500m 到 25,000m 之间飞行，在平飞状态下以超过 1372 m/s 的速度飞行 5 秒，然后安全地降落在任意地点并停稳。
		// EN: Four times the speed of sound doesn't sound...er seem that much more than three times the speed of …
		#loc_GAP_SSI_Mach4_notes = 四倍音速听起来……呃，看上去并不比三倍音速快多少。除非你是一颗流星——在这次任务的某个时刻，地面上的某个人说不定真会把你当成一颗流星。祝你好运！
		// EN: Congratulations! You have achieved Mach 4!\n\nGene says the Kerbal Space Program and its affiliates…
		#loc_GAP_SSI_Mach4_completedMessage = 恭喜！你已达成马赫 4！\n\nGene 说，坎巴拉太空计划及其合作机构对于通过航天飞机进入太空这件事是认真的，他们很快就会指望 SSI 和你的机构来实现这一目标。
		// EN: achieve Mach 4
		#loc_GAP_SSI_Mach4_PARAMETER2_title_2 = 达到马赫 4
		// EN: fly between 2500m and 35,000m
		#loc_GAP_SSI_Mach4_PARAMETER2_PARAMETER1_title = 在 2500m 至 35,000m 之间飞行
		// EN: fly faster than 1372 m/s
		#loc_GAP_SSI_Mach4_PARAMETER2_PARAMETER2_title_2 = 以超过 1372 m/s 的速度飞行

		//==================== Milestones/Wright-2500m.cfg ====================

		// EN: Fly an airplane to 2,500m.
		#loc_GAP_Wright_2500m_title = 驾驶飞机飞到 2,500m。
		// EN: Taking off and landing is easy. Flying up to 2,500m with an air-breathing engine and landing back a…
		#loc_GAP_Wright_2500m_description = 起飞和着陆很容易。用吸气式发动机飞到 2,500m，再飞回跑道降落……那就是完全另一回事了。Wilbur Kerman 说跑道就是未来的道路，还说你的飞行员最好习惯在跑道上降落。
		// EN: Simply launch an airplane from the runway, fly up to 2,500m, then land back at the runway safely.
		#loc_GAP_Wright_2500m_synopsis = 只需从跑道起飞一架飞机，飞到 2,500m，然后安全地飞回跑道降落。
		// EN: Enjoy the view!
		#loc_GAP_Wright_2500m_notes = 好好欣赏风景吧！
		// EN: Another historic flight completed!\n\nYour pilot is starting to showing some amazing skill with tha…
		#loc_GAP_Wright_2500m_completedMessage = 又一次历史性飞行完成了！\n\n从刚才那次着陆来看，你的飞行员开始展现出一些惊人的技术了。
		// EN: fly up to 2,500m
		#loc_GAP_Wright_2500m_PARAMETER2_title_2 = 飞到 2,500m

		//==================== Milestones/Wright-5000m.cfg ====================

		// EN: Fly an airplane to 5,000m.
		#loc_GAP_Wright_5000m_title = 驾驶飞机飞到 5,000m。
		// EN: Orville Kerman says it should be possible now to attempt an altitude record of 5,000m in an air-bre…
		#loc_GAP_Wright_5000m_description = Orville Kerman 说，现在应该有可能用一架吸气式飞机去挑战 5,000m 的高度纪录了。他说莱特航空已经得知，本地一家报纸悬赏奖励第一个达到 5,000m 飞行高度的机构，他认为你的机构或许能胜任这项任务。
		// EN: Simply launch an airplane from the runway, fly up to 5,000m, then land back at KSC safely.
		#loc_GAP_Wright_5000m_synopsis = 只需从跑道起飞一架飞机，飞到 5,000m，然后安全地飞回 KSC 降落。
		// EN: Enjoy the view, as at this altitude things on the ground really start to look small!
		#loc_GAP_Wright_5000m_notes = 好好欣赏风景吧，在这个高度，地面的东西真的开始显得很小了！
		// EN: 5,000m and you didn't hit a bird! Great job!\n\nUnfortunatley, hitting a bird was what the last pil…
		#loc_GAP_Wright_5000m_completedMessage = 5,000m，而且你没撞上鸟！干得漂亮！\n\n遗憾的是，上一位挑战这项壮举的飞行员也说了同样的话，随后他就从 4,500m 失控螺旋坠落，在管理大厦附近留下了一个大坑。\n\n正当 Gene Kerman 准备把这个大坑改建成一座航空先驱纪念池时，Orville Kerman 和 Inigma Kerman 都祝贺你安全返航。Inigma 说，如果你有兴趣，GAP 在任务控制中心还为你准备了一项挑战。
		// EN: fly up to 5,000m
		#loc_GAP_Wright_5000m_PARAMETER2_title_2 = 飞到 5,000m

		//==================== Milestones/Wright-FirstFlight.cfg ====================

		// EN: Build and fly your first airplane!
		#loc_GAP_Wright_FirstFlight_title = 建造并试飞你的第一架飞机！
		// EN: Thanks to your organization's research efforts, we have finally developed an air-breathing engine t…
		#loc_GAP_Wright_FirstFlight_description = 多亏了你的机构的研究努力，我们终于研发出了一台足够轻、可以安装到滑翔机上的吸气式发动机，让可控的动力飞行成为可能！\n\n以往把固体火箭用在滑翔机上的尝试，往往以灾难和志愿者稀缺告终。莱特航空想请你与他们合作，用一台吸气式发动机建造并测试一架飞行机器。你的飞行机器必须有机翼才能控制飞行，而且必须能够安全着陆。\n\n这是一片全新的疆域，此前已有许多人失败，所以目前没有任何投资资金可以给你。莱特航空愿意承担人工成本、零食，并通知媒体；但你得自掏腰包购置这个项目所需的零件。如果你成功了，你的飞行员将获得宝贵的飞行技能，你的机构也将闻名世界。
		// EN: It's time to construct a flying machine - one that will prove to the world that controlled powered …
		#loc_GAP_Wright_FirstFlight_synopsis = 是时候造一架飞行机器了——一架能向全世界证明可控动力飞行确实可行的飞行机器！
		// EN: Wilbur and Orville both wanted to go, but the coin they flipped landed on its side - hence the reas…
		#loc_GAP_Wright_FirstFlight_notes = Wilbur 和 Orville 两人都想去，可他们抛的那枚硬币却立在了边上——所以他们才会请你派一名志愿者来驾驶这台古怪的机器。
		// EN: Congratulations! The flight was a success!\n\nThe historic flight was thankfully caught on camera b…
		#loc_GAP_Wright_FirstFlight_completedMessage = 恭喜！飞行成功了！\n\n幸好唯一回应新闻邀请的那位记者用相机拍下了这次历史性飞行。他关于你这次飞行的报道已被数百万人读到，如今你已激发了各地坎巴拉人的想象力。
		// EN: Your flying machine must
		#loc_GAP_Wright_FirstFlight_PARAMETER1_title = 你的飞行器必须

		//==================== Milestones/Wright-Glider.cfg ====================

		// EN: Build and fly a glider!
		#loc_GAP_Wright_Glider_title = 建造并试飞一架滑翔机！
		// EN: Wilbur and Orville Kerman have been overseeing GAP's flying machine project and have formed a new v…
		#loc_GAP_Wright_Glider_description = Wilbur Kerman 和 Orville Kerman 一直在监管 GAP 的飞行器项目，并成立了一家名为莱特航空的新创公司，以探索动力飞行的前沿。作为起步，他们希望你研制一架原型滑翔机，用来验证几项飞行控制概念。你的滑翔机必须有指令座椅、用于控制飞行的机翼，并且能够安全着陆。\n\n如何把滑翔机弄上天，全凭你的想象力，不过 Jebediah Kerman 推荐久经考验的固体火箭方案。或者从悬崖上跳下去也行。随你选。无论你决定怎么做，只要确保你的飞行员活下来——我们可不想在项目刚开始就惹上负面新闻。要算作真正的滑翔机，你需要把决定使用的任何助推器分离掉。
		// EN: Making a glider isn't that hard. Getting it up off the ground, however, will present a challenge.
		#loc_GAP_Wright_Glider_synopsis = 造一架滑翔机并不难。但要让它离开地面，就是个挑战了。
		// EN: Jebediah hints that if you decide to go with a solid rocket launch assist, that you include a means…
		#loc_GAP_Wright_Glider_notes = Jebediah 暗示，如果你决定采用固体火箭助推起飞，最好带上分离固体火箭的装置，让飞行更平稳。
		// EN: The glider flight test was a success!\n\nThe fact that you landed safely is even more amazing.
		#loc_GAP_Wright_Glider_completedMessage = 滑翔机试飞成功！\n\n你居然还能安全着陆，这就更了不起了。
		// EN: Your glider must
		#loc_GAP_Wright_Glider_PARAMETER1_title = 你的滑翔机必须
		// EN: have a command seat
		#loc_GAP_Wright_Glider_PARAMETER1_PARAMETER2_title_2 = 有指令座椅
		// EN: not have any engines after launch
		#loc_GAP_Wright_Glider_PARAMETER1_PARAMETER4_title_4 = 发射后不携带任何发动机

		//==================== Milestones/Wright-Speed100.cfg ====================

		// EN: Achieve an airspeed of 100 m/s
		#loc_GAP_Wright_Speed100_title = 达到 100 m/s 的空速
		// EN: Kurtis Kerman, a friend of Wilbur Kerman, suggests that an airplane, if designed properly, should b…
		#loc_GAP_Wright_Speed100_description = Kurtis Kerman 是 Wilbur Kerman 的朋友，他认为飞机只要设计得当，就应该能超过最快地面载具的速度，而且不必俯冲向下就能做到。莱特航空有兴趣帮忙证明这是可行的（我们希望你知道这里的“这”指的是什么）。他们希望你驾驶一架吸气式飞机升到 2,500m 以上、5,000m 以下，看看能否在受控平飞中安全超过 100 m/s，从而打破当前的载人载具速度纪录。
		// EN: Simply launch an airplane from the runway, fly between 2,500m and 5,000m, exceed 220 m/s in level f…
		#loc_GAP_Wright_Speed100_synopsis = 只需让一架飞机从跑道起飞，在 2,500m 到 5,000m 之间飞行，在平飞中超过 220 m/s 并保持 5 秒，然后安全返回 KSC 着陆。
		// EN: Congratulations, you have set a new air speed record of 100 m/s!\n\nYou have justified Kurtis Kerma…
		#loc_GAP_Wright_Speed100_completedMessage = 恭喜，你创下了 100 m/s 的新空速纪录！\n\n你证实了 Kurtis Kerman 关于高速飞行的理论，也为莱特航空再添了一份名声与声望。赞助商们开始打听该如何支持这片新的空速前沿。去任务控制中心看看，莱特航空是否还有另一份合同在等着你！
		// EN: achieve a maximum airspeed of 100 m/s
		#loc_GAP_Wright_Speed100_PARAMETER2_title_2 = 达到 100 m/s 的最大空速
		// EN: fly faster than 100 m/s
		#loc_GAP_Wright_Speed100_PARAMETER2_PARAMETER2_title_2 = 以超过 100 m/s 的速度飞行

		//==================== Milestones/Wright-Speed220.cfg ====================

		// EN: Achieve an airspeed of 220 m/s
		#loc_GAP_Wright_Speed220_title = 达到 220 m/s 的空速
		// EN: Kurtis Kerman, now a fellow engineer with Wright Aeronautical, thinks that with additional tweaking…
		#loc_GAP_Wright_Speed220_description = Kurtis Kerman 现在是莱特航空的工程师同行，他认为只要对现有的飞机设计再做一些微调，就有可能在平飞中超过 220 m/s。多位赞助商给了 GAP 一笔钱来促成此事，只要你接下这份合同，Inigma Kerman 非常乐意把它全部转给莱特航空，再送到你的机构手里！\n\n不过尝试高速飞行可不是胆小者能干的。有飞行员报告，俯冲接近高速时飞机会剧烈抖动，还有些飞机在超过 220 m/s 时因气动力而解体。Inigma 希望你能成为第一个把吸气式飞机升到 2,500m 以上、5,000m 以下，并在受控平飞中超过 220 m/s、然后安全返航的人。这么做会让赞助商获得相当不错的投资回报，也让资金进到你的口袋里。
		// EN: Simply launch an airplane from the runway, fly between 2,500m and 5,000m, exceed 220 m/s in level f…
		#loc_GAP_Wright_Speed220_synopsis = 只需让一架飞机从跑道起飞，在 2,500m 到 5,000m 之间飞行，在平飞中超过 220 m/s 并保持 5 秒，然后安全返回 KSC 着陆。
		// EN: Congratulations, you have set a new airspeed record of 220 m/s and returned alive!\n\nYour success …
		#loc_GAP_Wright_Speed220_completedMessage = 恭喜，你创造了 220 m/s 的新空速纪录，并且活着回来了！\n\n你成功应对了莱特航空的空速挑战，Inigma Kerman 因此点名找你，看你能否帮助 GAP 攻克有史以来最大胆的空速挑战之一。详情请到任务控制中心查询。
		// EN: achieve a maximum airspeed of 220 m/s
		#loc_GAP_Wright_Speed220_PARAMETER2_title_2 = 达到 220 m/s 的最大空速
		// EN: fly faster than 220 m/s
		#loc_GAP_Wright_Speed220_PARAMETER2_PARAMETER2_title_2 = 以超过 220 m/s 的速度飞行

		//==================== Rescue/CoastGuard-RescueClimbers-Easy.cfg ====================

		// EN: Medevac: Rescue climbers near K2 (Easy)
		#loc_GAP_CoastGuard_RescueClimbers_Easy_title = 医疗后送：营救 K2 附近的登山者（简单）
		// EN: The KSC Coast Guard has received an emergency call from the Kerbin Peak Mountain Trail Ranger Stati…
		#loc_GAP_CoastGuard_RescueClimbers_Easy_description = KSC 海岸警卫队接到了 Kerbin Peak Mountain Trail Ranger Station 打来的紧急求助电话。\n\n据报有两名登山者分别被困在 K2 山脉相对的两座山峰上，起因是他们争论 K2 到底哪一面才是正确的上山方向。显然其中一人带着绳索，另一人带着挂钩，如今两人都需要救援。派出一支搜救队去营救这两名登山者，并将他们送回海岸警卫队着陆区安全回收。Lt. Dan Kerman 已指派登山专家 Ens. Joe Kerman 参与此次任务，协助回收登山者。
		// EN: Rescue climbers 
		#loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s1 = 营救登山者
		// EN:  and 
		#loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s2 = 和
		// EN:  from their respective locations in the K2 mountains, and bring them to any KSC Coast Guard rescue …
		#loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s3 = ，将他们从 K2 山脉各自的位置带回任意 KSC 海岸警卫队救援站安全回收。
		// EN: KSC Coast Guard rescue mission accomplished!\n\nThe climbers were retrieved from the mountain safel…
		#loc_GAP_CoastGuard_RescueClimbers_Easy_completedMessage = KSC 海岸警卫队救援任务完成！\n\n登山者已从山上安全救回。他们保证下次一定不再分开。
		// EN: K2 Summit
		#loc_GAP_PQS_CITY_K2_Summit_name = K2 顶峰
		// EN: have at least 3 passenger seats
		#loc_GAP_CoastGuard_RescueClimbers_Easy_PARAMETER1_PARAMETER2_title_2 = 至少有 3 个乘客座位
		// EN: rescue climbers
		#loc_GAP_CoastGuard_RescueClimbers_Easy_PARAMETER3_title_3 = 营救登山者

		//==================== Rescue/CoastGuard-RescuePilot.cfg ====================

		// EN: Mayday: 
		#loc_GAP_CoastGuard_RescuePilot_title_s1 = Mayday：
		// EN: Mayday: Rescue Pilot
		#loc_GAP_CoastGuard_RescuePilot_genericTitle = Mayday：营救飞行员
		// EN: The KSC Coast Guard received a mayday from 
		#loc_GAP_CoastGuard_RescuePilot_description_s1 = KSC 海岸警卫队收到来自
		// EN:  who reported trouble with his plane and had to eject. Send out a Search and Rescue team to save th…
		#loc_GAP_CoastGuard_RescuePilot_description_s2 = 的求救信号，他报告飞机出了故障，不得不弹射逃生。派出一支搜救队救出该飞行员，并将他送回海岸警卫队着陆区安全回收。
		// EN: The KSC Coast Guard received a mayday from a pilot who reported trouble with his plane and had to e…
		#loc_GAP_CoastGuard_RescuePilot_genericDescription = KSC 海岸警卫队收到一名飞行员的求救信号，他报告飞机出了故障，不得不弹射逃生。派出一支搜救队救出该飞行员，并将他送回海岸警卫队着陆区安全回收。
		// EN: Rescue 
		#loc_GAP_CoastGuard_RescuePilot_notes_s1 = 营救
		// EN:  and bring them to any KSC Coast Guard rescue station for a safe recovery.
		#loc_GAP_CoastGuard_RescuePilot_notes_s2 = ，并将他们带回任意 KSC 海岸警卫队救援站安全回收。
		// EN: KSC Coast Guard rescue mission accomplished!\n\n
		#loc_GAP_CoastGuard_RescuePilot_completedMessage_s1 = KSC 海岸警卫队救援任务完成！\n\n
		// EN:  was retrieved from the area with minimal injury. Your successful operation hasn't gone unnoticed b…
		#loc_GAP_CoastGuard_RescuePilot_completedMessage_s2 = 已从该区域被救回，仅受轻伤。你的成功行动并未被坎巴拉太空计划忽视。请前往任务控制中心报到，接受你的下一个任务。
		// EN: KSC Sea North Central Waypoint
		#loc_GAP_PQS_CITY_KSC_Sea_North_Central_Waypoint_name = KSC 海中北部导航点
		// EN: KSC Sea Central Central Waypoint
		#loc_GAP_PQS_CITY_KSC_Sea_Central_Central_Waypoint_name_2 = KSC 海中部导航点
		// EN: KSC Sea South Central Waypoint
		#loc_GAP_PQS_CITY_KSC_Sea_South_Central_Waypoint_name_3 = KSC 海中南部导航点
		// EN: East Islands Sea Central Waypoint
		#loc_GAP_PQS_CITY_East_Islands_Sea_Central_Waypoint_name_4 = 东部群岛海域中部导航点
		// EN: South Islands Sea Central Waypoint
		#loc_GAP_PQS_CITY_South_Islands_Sea_Central_Waypoint_name_5 = 南部群岛海域中部导航点
		// EN: KSC Island Airfield
		#loc_GAP_PQS_CITY_KSC_Island_Airfield_name = KSC 小岛机场
		// EN: have at least 2 passenger seats
		#loc_GAP_CoastGuard_RescuePilot_PARAMETER1_PARAMETER2_title_2 = 至少有 2 个乘客座位
		// EN: rescue test pilot
		#loc_GAP_CoastGuard_RescuePilot_PARAMETER3_title_3 = 救援试飞员
		// EN: the KSC Island Airfield
		#loc_GAP_CoastGuard_RescuePilot_PARAMETER4_PARAMETER1_PARAMETER1_title = KSC 小岛机场
		// EN: without destroying your rescue craft
		#loc_GAP_CoastGuard_RescuePilot_PARAMETER5_PARAMETER1_title = 不损毁你的救援载具

		//==================== Stunts/Wright-Bail.cfg ====================

		// EN: Jump from an airplane!
		#loc_GAP_Wright_Bail_title = 从飞机上跳下去！
		// EN: SSI's safety enginer, Garnerin Kerman believes it's possible to survive jumping out of an airplane …
		#loc_GAP_Wright_Bail_description = SSI 的安全工程师 Garnerin Kerman 认为，靠他所说的“降落伞”从遇险的飞机上跳下来是有可能生还的。但他也纳闷：为了测试它，你为什么偏要跳出一架完好无损的飞机？他说，如果你真要做这件事，就得先签一份免责声明，免得他背上“测试失败”的黑锅。莱特航空的 Orville Kerman 说：“这个想法从没被验证过……除了那次有人裹着床单从楼顶上跳下去。”他说只要你有一套靠谱的实施方案，他暂且愿意为这个点子撑腰。“不用说，”他接着说，“上次用床单的那次尝试可不太成功。可怜的小伙子。”
		// EN: Simply launch an airplane with a pilot and a jump volunteer, then fly above 2500m and have your vol…
		#loc_GAP_Wright_Bail_synopsis = 只要驾驶一架飞机升空，机上带一名飞行员和一名跳伞志愿者，然后飞到 2500m 以上，让你的志愿者从这架完好无损的飞机上跳出去。最后把飞机安全降回 KSC。
		// EN: Enjoy the freefall! It is recommended that you take Garnerin up on his idea and outfit your volunte…
		#loc_GAP_Wright_Bail_notes = 尽情享受自由落体吧！建议你采纳 Garnerin 的主意，给你的志愿者配一具降落伞，否则自由落体的快感在着陆时可能就完全反过来了。要是你手头没有降落伞，Jebediah Kerman 曾悄悄跟 Orville 说，EVA 头盔也可以当作一种着陆替代方案，但 Orville 只是狠狠地瞪了他一眼，摇了摇头，然后转身回机库去了。
		// EN: You jumped out of an airplane and surived!\n\nIt appears your successful stunt has attracted the in…
		#loc_GAP_Wright_Bail_completedMessage = 你从飞机上跳了下去，还活着！\n\n看来你的特技表演成功引起了 Corliss Paraventures 的兴趣。请前往任务控制中心了解更多详情。
		// EN: and a jump volunteer
		#loc_GAP_Wright_Bail_PARAMETER1_PARAMETER2_title_2 = 以及一名跳伞志愿者
		// EN: fly above 2500m
		#loc_GAP_Wright_Bail_PARAMETER2_title_2 = 飞到 2500m 以上
		// EN: exit your jumper from the airplane
		#loc_GAP_Wright_Bail_PARAMETER3_title_3 = 让跳伞者离开飞机
		// EN: and land your jumper safely
		#loc_GAP_Wright_Bail_PARAMETER4_title_4 = 并让跳伞者安全着陆
		// EN: without serious injury
		#loc_GAP_Wright_Bail_PARAMETER4_PARAMETER4_title = 不造成重伤
		// EN: and then land and stop your airplane
		#loc_GAP_Wright_Bail_PARAMETER5_title_5 = 然后着陆并让飞机停稳

		//==================== Stunts/Wright-BarnstormIsland.cfg ====================

		// EN: Barnstorm the Island Airfield hangars!
		#loc_GAP_Wright_BarnstormIsland_title = 低空特技穿越小岛机场机库！
		// EN: Jebediah thinks barnstorming the Island Airfield hangars is totally possible, and looks to be far e…
		#loc_GAP_Wright_BarnstormIsland_description = Jebediah 认为低空特技穿越小岛机场机库完全可行，而且看起来比穿越他的棚屋容易得多。Gene 勉强批准了这个想法，并已清空了小岛上空的全部空中交通，直到你完成这次特技为止。莱特航空觉得这又是一次检验你飞行员驾驶技术的好机会，但提醒你不要提前通知媒体。
		// EN: Go barnstorm one of the Island Airfield hangars. Earn a bonus reputation if you can barnstorm the s…
		#loc_GAP_Wright_BarnstormIsland_synopsis = 去低空特技穿越小岛机场的一座机库。如果你还能穿越第二座机库，可获得额外声望奖励。
		// EN: Be sure your pilot signs off on the insurance waiver before attempting this one, as it's not covere…
		#loc_GAP_Wright_BarnstormIsland_notes = 尝试这项特技前，务必让你的飞行员签署保险免责声明，因为这项是不在保险范围内的。
		// EN: You did it!\n\nGround crew personnel at the Island Airfield share the story of your successful stun…
		#loc_GAP_Wright_BarnstormIsland_completedMessage = 你做到了！\n\n小岛机场的地勤人员把你这次成功特技的故事讲给了他们认识的每一个人。Gene 说，如果你哪天做特技做腻了，只要你有兴趣，任务控制中心还有更重要的活儿等着你。
