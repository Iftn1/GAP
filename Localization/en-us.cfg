		#loc_GAP_PQS_CITY_KSC_Sea_South_Central_Waypoint_name_3 = KSC Sea South Central Waypoint
		#loc_GAP_PQS_CITY_East_Islands_Sea_Central_Waypoint_name_4 = East Islands Sea Central Waypoint
		#loc_GAP_PQS_CITY_South_Islands_Sea_Central_Waypoint_name_5 = South Islands Sea Central Waypoint
		#loc_GAP_PQS_CITY_KSC_Island_Airfield_name = KSC Island Airfield
		#loc_GAP_CoastGuard_RescuePilot_PARAMETER1_PARAMETER2_title_2 = have at least 2 passenger seats
		#loc_GAP_CoastGuard_RescuePilot_PARAMETER3_title_3 = rescue test pilot
		#loc_GAP_CoastGuard_RescuePilot_PARAMETER4_PARAMETER1_PARAMETER1_title = the KSC Island Airfield
		#loc_GAP_CoastGuard_RescuePilot_PARAMETER5_PARAMETER1_title = without destroying your rescue craft

		//==================== Stunts/Wright-Bail.cfg ====================

		#loc_GAP_Wright_Bail_title = Jump from an airplane!
		#loc_GAP_Wright_Bail_description = SSI's safety enginer, Garnerin Kerman believes it's possible to survive jumping out of an airplane in distress using what he calls a \"parachute.\" But he wonders why you would want to jump out of a perfectly good airplane in order to test it? He says if you really want to do this, that you will need to sign a waiver of liability lest he get the rap for an \"unsuccessful test.\" Orville Kerman of Wright Aeronautical says \"it's an idea that's never been tested... except for that one time someone jumped off a building with a bedsheet.\" He says he'll sport the idea for now assuming you've got a good plan to pull it off. \"Needless to say,\" he continued, \"the previous attempt with the bedsheet wasn't very successful. Poor lad.\"
		#loc_GAP_Wright_Bail_synopsis = Simply launch an airplane with a pilot and a jump volunteer, then fly above 2500m and have your volunteer jump out of the perfectly good airplane. Finally, land your airplane safely back at KSC.
		#loc_GAP_Wright_Bail_notes = Enjoy the freefall! It is recommended that you take Garnerin up on his idea and outfit your volunteer a parachute, else the joy of freefall could turn quite the opposite on landing. If you don't have any parachutes, Jebediah Kerman whispered something to Orville about EVA helmets being a possible landing alternative, but Orville simply gave him a hard stare and shook his head, before heading back to the hangar.
		#loc_GAP_Wright_Bail_completedMessage = You jumped out of an airplane and surived!\n\nIt appears your successful stunt has attracted the interest of Corliss Paraventures. Check in with Mission Control for more details.
		#loc_GAP_Wright_Bail_PARAMETER1_PARAMETER2_title_2 = and a jump volunteer
		#loc_GAP_Wright_Bail_PARAMETER2_title_2 = fly above 2500m
		#loc_GAP_Wright_Bail_PARAMETER3_title_3 = exit your jumper from the airplane
		#loc_GAP_Wright_Bail_PARAMETER4_title_4 = and land your jumper safely
		#loc_GAP_Wright_Bail_PARAMETER4_PARAMETER4_title = without serious injury
		#loc_GAP_Wright_Bail_PARAMETER5_title_5 = and then land and stop your airplane

		//==================== Stunts/Wright-BarnstormIsland.cfg ====================

		#loc_GAP_Wright_BarnstormIsland_title = Barnstorm the Island Airfield hangars!
		#loc_GAP_Wright_BarnstormIsland_description = Jebediah thinks barnstorming the Island Airfield hangars is totally possible, and looks to be far easier to do than his shed. Gene has reluctantly signed off on the idea and has cleared the Island of all air traffic until you're done with the stunt. Wright Aeronautical thinks it's another good opportunity to test your pilot's flying skills, but caution against informing the press ahead of time.
		#loc_GAP_Wright_BarnstormIsland_synopsis = Go barnstorm one of the Island Airfield hangars. Earn a bonus reputation if you can barnstorm the second hangar too.
		#loc_GAP_Wright_BarnstormIsland_notes = Be sure your pilot signs off on the insurance waiver before attempting this one, as it's not covered.
		#loc_GAP_Wright_BarnstormIsland_completedMessage = You did it!\n\nGround crew personnel at the Island Airfield share the story of your successful stunt with everyone they know. Gene says if you ever get tired of doing stunts, there's more important jobs for you at Mission Control if you're interested.
		#loc_GAP_PQS_CITY_Hangar_1_name = Hangar 1
		#loc_GAP_PQS_CITY_Hangar_2_name_2 = Hangar 2
		#loc_GAP_Wright_BarnstormIsland_PARAMETER2_title_2 = barnstorm Hangar 1
		#loc_GAP_Wright_BarnstormIsland_PARAMETER3_title_3 = barnstorm Hangar 2

		//==================== Stunts/Wright-BarnstormRD.cfg ====================

		#loc_GAP_Wright_BarnstormRD_title = Barnstorm the R&D Center!
		#loc_GAP_Wright_BarnstormRD_description = Barnstorm the R&D Center bridge and tunnel? Jebediah thinks it can be done. Gene has signed off on the attempt. Wright Aeronautical thinks it might lead to an air show at some point. At least for now, the cameras won't be rolling in case... well... you get the gist. As a result, to avoid liability, this is a totally self-funded venture, but you will earn a significant amount of reputation and pilot experience if you do both.
		#loc_GAP_Wright_BarnstormRD_synopsis = Go barnstorm the R&D pedestrian bridge. Earn a bonus reputation if you can barnstorm the tunnel too.
		#loc_GAP_Wright_BarnstormRD_notes = Be sure your pilot signs off on the insurance waiver before attempting this one, as it's not covered.
		#loc_GAP_Wright_BarnstormRD_completedMessage = Wow! You did it! Those who saw it were impressed. Well done! Gene says if you ever get tired of doing stunts, there's some important jobs for you at Mission Control if you're interested.
		#loc_GAP_PQS_CITY_R_D_Center_Pedestrian_Bridge_name = R&D Center Pedestrian Bridge
		#loc_GAP_PQS_CITY_R_D_Center_Tunnel_name_2 = R&D Center Tunnel
		#loc_GAP_Wright_BarnstormRD_PARAMETER2_title_2 = fly under the R&D Center Pedestrian Bridge
		#loc_GAP_Wright_BarnstormRD_PARAMETER3_title_3 = fly under R&D Center Tunnel

	}
}
