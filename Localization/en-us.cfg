		//==================== Marketplace/GAP-Wright-FuelLine.cfg ====================

		#loc_GAP_GAP_Wright_FuelLine_title = Purchase fuel line tech.
		#loc_GAP_GAP_Wright_FuelLine_description = Hello, my name is Orville Kerman, and I and my brother founded Wright Aeronautical. We started out with a bicycle company but have only recently begun exploring the area of aerodynamics. We have recently developed an engine that is light enough to mount onto a flying machine!\n\nYou may purchase the following production-ready prototype part that will allow you to start making flying machines:\n\n- FTX-2 External Fuel Duct
		#loc_GAP_GAP_Wright_FuelLine_synopsis = Flight engine technology is at your fingertips! Simply cover the cost of our initial production run, and this prototype part will be yours!
		#loc_GAP_GAP_Wright_FuelLine_notes = The part will be available immediately to your organization upon contract acceptance.
		#loc_GAP_GAP_Wright_FuelLine_completedMessage = Part transfer complete.\n\nYour organization now has access to the following:\n\n- FTX-2 External Fuel Duct\n\nEnjoy the new part!

		//==================== Marketplace/GAP-Wright-FuelTank.cfg ====================

		#loc_GAP_GAP_Wright_FuelTank_title = Purchase fuel tank tech.
		#loc_GAP_GAP_Wright_FuelTank_description = Hello, my name is Orville Kerman, and I and my brother founded Wright Aeronautical. We started out with a bicycle company but have only recently begun exploring the area of aerodynamics. We have recently developed an engine that is light enough to mount onto a flying machine!\n\nYou may purchase the following production-ready prototype part that will allow you to start making flying machines:\n\n- Oscar-B Fuel Tank
		#loc_GAP_GAP_Wright_FuelTank_synopsis = Flight engine technology is at your fingertips! Simply cover the cost of our initial production run, and this prototype part will be yours!
		#loc_GAP_GAP_Wright_FuelTank_notes = The part will be available immediately to your organization upon contract acceptance.
		#loc_GAP_GAP_Wright_FuelTank_completedMessage = Part transfer complete.\n\nYour organization now has access to the following:\n\n- Oscar-B Fuel Tank\n\nEnjoy the new part!

		//==================== Marketplace/GAP-Wright-Intake.cfg ====================

		#loc_GAP_GAP_Wright_Intake_title = Purchase air intake tech.
		#loc_GAP_GAP_Wright_Intake_description = Hello, my name is Orville Kerman, and I and my brother founded Wright Aeronautical. We started out with a bicycle company but have only recently begun exploring the area of aerodynamics. We have recently developed an engine that is light enough to mount onto a flying machine!\n\nYou may purchase the following production-ready prototype part that will allow you to start making flying machines:\n\n- Small Circular Intake
		#loc_GAP_GAP_Wright_Intake_synopsis = Flight engine technology is at your fingertips! Simply cover the cost of our initial production run, and this prototype part will be yours!
		#loc_GAP_GAP_Wright_Intake_notes = The part will be available immediately to your organization upon contract acceptance.
		#loc_GAP_GAP_Wright_Intake_completedMessage = Part transfer complete.\n\nYour organization now has access to the following:\n\n- Small Circular Intake\n\nEnjoy the new parts!

		//==================== Marketplace/GAP-Wright-KAXVintagePropelator.cfg ====================

		#loc_GAP_GAP_Wright_KAXVintagePropelator_title = Purchase KAX propeller tech.
		#loc_GAP_GAP_Wright_KAXVintagePropelator_description = Hello, my name is Orville Kerman, and I and my brother founded Wright Aeronautical. We started out with a bicycle company but have only recently begun exploring the area of aerodynamics. We have recently developed an engine that is light enough to mount onto a flying machine!\n\nYou may purchase the following production-ready prototype that will allow you to start making flying machines:\n\n- Vintage Propelator
		#loc_GAP_GAP_Wright_KAXVintagePropelator_synopsis = Propeller engine technology is at your fingertips! Simply cover the cost of our initial production run, and this prototype will be yours!
		#loc_GAP_GAP_Wright_KAXVintagePropelator_notes = The part will be available immediately to your organization upon contract acceptance.
		#loc_GAP_GAP_Wright_KAXVintagePropelator_completedMessage = Part transfer complete.\n\nYour organization now has access to the following:\n\n- Vintage Propelator\n\nEnjoy the new part!

		//==================== Marketplace/GAP-Wright-Sepratron.cfg ====================

		#loc_GAP_GAP_Wright_Sepratron_title = Purchase sepratron tech.
		#loc_GAP_GAP_Wright_Sepratron_description = Hello, my name is Orville Kerman, and I and my brother founded Wright Aeronautical. We started out with a bicycle company but have only recently begun exploring the area of aerodynamics. We have recently developed flight control technology that we know will eventually lead to controllable flying machines!\n\nYou may purchase the following production-ready prototype that will allow you to start making flying machines:\n\n- Sepratron I
		#loc_GAP_GAP_Wright_Sepratron_synopsis = Flight control technology is at your fingertips! Simply cover the cost of our initial production run, and this prototype will be yours!
		#loc_GAP_GAP_Wright_Sepratron_notes = The part will be available immediately to your organization upon contract acceptance.
		#loc_GAP_GAP_Wright_Sepratron_completedMessage = Part transfer complete.\n\nYour organization now has access to the following:\n\n- Sepratron I\n\nEnjoy the new part!

		//==================== Marketplace/GAP-Wright-Wing.cfg ====================

		#loc_GAP_GAP_Wright_Wing_title = Purchase wing tech.
		#loc_GAP_GAP_Wright_Wing_description = Hello, my name is Orville Kerman, and I and my brother founded Wright Aeronautical. We started out with a bicycle company but have only recently begun exploring the area of aerodynamics. We have recently developed flight control technology that we know will eventually lead to controllable flying machines!\n\nYou may purchase the following production-ready prototype that will allow you to start making flying machines:\n\n- Wing Connector Type E
		#loc_GAP_GAP_Wright_Wing_synopsis = Flight control technology is at your fingertips! Simply cover the cost of our initial production run, and this prototype will be yours!
		#loc_GAP_GAP_Wright_Wing_notes = The part will be available immediately to your organization upon contract acceptance.
		#loc_GAP_GAP_Wright_Wing_completedMessage = Part transfer complete.\n\nYour organization now has access to the following:\n\n- Wing Connector Type E\n\nEnjoy the new part!

		//==================== Milestones/GAP-Helicopter.cfg ====================

		#loc_GAP_GAP_Helicopter_title = Land on a helipad!
		#loc_GAP_GAP_Helicopter_description = We want you to test your first helicopter or Vertical Take-Off and Landing (VTOL) prototype. Land on one of the available helipads.
		#loc_GAP_GAP_Helicopter_synopsis = For science (and a few funds)!
		#loc_GAP_GAP_Helicopter_notes = Make a helicopter or VTOL and land on a VAB or Administration Building helipad!
		#loc_GAP_GAP_Helicopter_completedMessage = Flight Completed! And you're still alive, which is even better since most helicopter and other VTOL test flights have been fatal.
		#loc_GAP_GAP_Helicopter_PARAMETER2_title_2 = land on a helipad
		#loc_GAP_GAP_Helicopter_PARAMETER2_PARAMETER1_title = at either
		#loc_GAP_GAP_Helicopter_PARAMETER2_PARAMETER1_PARAMETER2_title_2 = or the Administration Building Helipad

		//==================== Milestones/GAP-Seaplane.cfg ====================

		#loc_GAP_GAP_Seaplane_title = Build and fly a seaplane!
		#loc_GAP_GAP_Seaplane_description = You've proven the airworthiness of your aircraft so far. But can you modify it or design an aircraft that can land on water? We want you to attempt an aviation first - landing an airplane on water, and taking back off again. Our engineers would like to call such an idea a seaplane, and they think it will really be useful to a number of organizations at KSC if the idea can be proven.
		#loc_GAP_GAP_Seaplane_synopsis = Land a seaplane on the surface of the water at the waypoint, and take off again and land back at KSC.
		#loc_GAP_GAP_Seaplane_notes = Your craft must be an airplane that can land on water horizontally and take off again.
		#loc_GAP_GAP_Seaplane_completedMessage = Congratulations on another aviation first! You have propelled your organization to one of the most popular organizations on Kerbin. GAP has credited your account with a share of funds from various investors who are excited about your organization's future.
		#loc_GAP_GAP_Seaplane_PARAMETER1_title = Your seaplane must
		#loc_GAP_GAP_Seaplane_PARAMETER2_title_2 = land on water
		#loc_GAP_GAP_Seaplane_PARAMETER3_title_3 = and slow to 3.0 m/s or less
		#loc_GAP_GAP_Seaplane_PARAMETER4_title_4 = and then go at least 20.0 m/s on water
		#loc_GAP_GAP_Seaplane_PARAMETER5_title_5 = and then get airborne

		//==================== Milestones/SSI-10000m.cfg ====================

		#loc_GAP_SSI_10000m_title = Fly an airplane to 10,000m.
		#loc_GAP_SSI_10000m_description = Inigma Kerman of SSI wants you to design and fly an aircraft capable of operating at an altitude of 10,000m. He says that such an accomplishment will make future air travel safer since most of Kerbin's serious weather only happens below this altitude. He says that if pilots could simply fly over bad weather rather than through it, it would unlock a large number of regional and possibly global air travel possibilities.
		#loc_GAP_SSI_10000m_synopsis = Simply launch an airplane from the runway, fly up to 10,000m, then land back at KSC safely.
		#loc_GAP_SSI_10000m_notes = Enjoy the view, as at this altitude the clouds (if any are seen today) will mostly be below your aircraft!
		#loc_GAP_SSI_10000m_completedMessage = You did it! 10,000m reached, and your pilot snapped a great picture!\n\nWhile your pilot rests up at the Astronaut Complex, be sure to check in with Gene at Mission Control for another SSI opportunity if interested.
		#loc_GAP_SSI_10000m_PARAMETER2_title_2 = fly up to 10,000m

		//==================== Milestones/SSI-20000m.cfg ====================

		#loc_GAP_SSI_20000m_title = Fly an airplane to 20,000m.
		#loc_GAP_SSI_20000m_description = Maculator Kerman has another challenge for you, this time one that could very well unlock opportunities for regular global air travel - achieve a flying altitude of 20,000m. He says accomplishing such a flying altitude will prove that even the highest mountains on Kerbin can be flown over, which would unlock nearly any destination on Kerbin by air!
		#loc_GAP_SSI_20000m_synopsis = Simply launch an airplane from the runway, fly up to 20,000m, then land back at KSC safely.
		#loc_GAP_SSI_20000m_notes = Enjoy the view, as at this altitude the curvature of Kerbin will be clearly visible!
		#loc_GAP_SSI_20000m_completedMessage = You did it! 20,000m reached!\n\nA number of opportunities have opened up now that global air travel is just on the horizon of possibility. Check back in with Mission Control for a new contract opportunities!
		#loc_GAP_SSI_20000m_PARAMETER2_title_2 = fly up to 20,000m

		//==================== Milestones/SSI-35000m.cfg ====================

		#loc_GAP_SSI_35000m_title = Fly an airplane to 35,000m.
		#loc_GAP_SSI_35000m_description = SSI Aerospace and the Kerbal Space Program have selected your organization to receive special funding to design and fly an aircraft that will reach the upper atmospheric height of 35,000m. Inigma Kerman explains that accomplishing this feat will open up the exciting frontier of spaceplane development!
		#loc_GAP_SSI_35000m_synopsis = Simply launch an airplane from the runway, fly up to 35,000m, then land back at KSC safely.
		#loc_GAP_SSI_35000m_notes = Enjoy the view, as at this altitude you will feel as if you are touching the very boundary of space!
		#loc_GAP_SSI_35000m_completedMessage = You did it! 35,000m reached! The air was really thin up there, wasn't it? No worries, we have fresh air back at Mission Control.\n\nGreat job! The Spaceplane Frontier is opened!
		#loc_GAP_SSI_35000m_PARAMETER2_title_2 = fly up to 35,000m

		//==================== Milestones/SSI-60000m.cfg ====================

		#loc_GAP_SSI_60000m_title = Fly a spaceplane to the edge of space!
		#loc_GAP_SSI_60000m_description = The Kerbal Space Program wants SSI Aerospace to be the first to develop a spaceplane for use in its space program. Inigma Kerman already had you on speed dial, and is currently asking your organization to lead this cutting edge effort.\n\nInigma says that you will need to develop a spaceplane - one that will be able to fly to the highest reaches of the atmosphere, and land on the ground safely. It's not that hard to say that 60,000m is a mere skip away from space. He says the Kerbal Space Program has already given authorization to make this a suborbital flight if desired - assuming you can engineer your spaceplane to do so, but it's not required to complete the mission.
		#loc_GAP_SSI_60000m_synopsis = Simply launch a spaceplane from the runway and fly up to 60,000m and then land your spaceplane anywhere on the ground safely. You may use an air-breathing engine, or liquid fueled engine, or both.
		#loc_GAP_SSI_60000m_notes = High above Kerbin, where space meets the air, and the stars beckon, will you realize that the universe is at your fingertips. That is, if Kerbals even have fingers other than their thumbs.
		#loc_GAP_SSI_60000m_completedMessage = Your spaceplane mission was a success! Mission Control erupted in celebration when you flew above 60,000m, and again when you landed. There are compliments all around, and your organization has been honored with a fairly large reward.
		#loc_GAP_SSI_60000m_PARAMETER2_title_2 = fly up to 60,000m

		//==================== Milestones/SSI-Mach1.cfg ====================

		#loc_GAP_SSI_Mach1_title = Break the sound barrier!
		#loc_GAP_SSI_Mach1_description = SSI Aerospace's chief scientist Mach Kerman, and KSP retired test pilot Yeager Kerman, want to push SSI toward developing a spaceplane. But before this can happen, Inigma Kerman of SSI says they need to master supersonic flight, and to do this, he is asking your organization to design a plane that can break through the sound barrier in level flight under 20,000m.\n\nAlthough not required to complete this challenge, Mach Kerman believes that if you design an airplane to use one of the new liquid fueled rocket engines being developed for use by the space program, might make this attempt easier to accomplish.
		#loc_GAP_SSI_Mach1_synopsis = Launch an airplane from the runway, fly between 2,500m and 20,000m, exceed 343 m/s in level flight for 5 seconds, and then land back at KSC safely.
		#loc_GAP_SSI_Mach1_notes = No one has ever gone faster than the speed of sound before, so most scientists and engineers are at a loss as to give you any useful advice. Even if they could, they're afraid you'd be traveling to fast to hear it anyways.
		#loc_GAP_SSI_Mach1_completedMessage = You have broken the sound barrier and achieved the amazing speed of Mach 1! Don't worry, we're sure it can be fixed back up in a jiffy for the next guy!
		#loc_GAP_SSI_Mach1_PARAMETER2_title_2 = break the sound barrier
		#loc_GAP_SSI_Mach1_PARAMETER2_PARAMETER2_title_2 = fly faster than 343 m/s

		//==================== Milestones/SSI-Mach2.cfg ====================

		#loc_GAP_SSI_Mach2_title = Achieve Mach 2!
		#loc_GAP_SSI_Mach2_description = Mach Kerman believes with current liquid-fueled rocket technology, that it's possible to exceed Mach 2, which is twice the speed of sound. Doing so would bring SSI another step closer to spaceplane development. He wants you to take an airplane above 2,500m but below 20,000m and see if you can exceed Mach 2 safely in level controlled flight.
		#loc_GAP_SSI_Mach2_synopsis = Launch an airplane from the runway, fly between 2,500m and 20,000m, exceed 686 m/s in level flight for 5 seconds, and then land back at KSC safely.
		#loc_GAP_SSI_Mach2_notes = Going Mach 1 was cool. Going Mach 2 will be even cooler. Unfortunately, scientists at SSI and at KSC both predict it will also lead to twice the number of required autographs when you get back.
		#loc_GAP_SSI_Mach2_completedMessage = Wow! You did it! You reached Mach 2, and came back safely!\n\nInigma passed your flight data to Gene Kerman at the Kerbal Space Program, and Gene says he's very proud of your accomplishments, and that he's very glad to have you and SSI Aerospace working together.
		#loc_GAP_SSI_Mach2_PARAMETER2_title_2 = achieve Mach 2
		#loc_GAP_SSI_Mach2_PARAMETER2_PARAMETER2_title_2 = fly faster than 686 m/s

		//==================== Milestones/SSI-Mach3.cfg ====================

		#loc_GAP_SSI_Mach3_title = Achieve Mach 3!
		#loc_GAP_SSI_Mach3_description = Gene Kerman wants SSI to develop supersonic aircraft for use by the space program. Inigma Kerman wants to use this as an opportunity to take another step toward the development of a spaceplane, and impress Gene with another SSI success. Therefore, Inigma is asking your organization to attempt a supersonic test flight exceeding Mach 3 by taking an airplane above 2,500m but below 25,000m and exceeding Mach 3 safely in a level, and controlled flight. Mach Kerman has informed SSI that this is not going to be easy as thermal effects are expected at this speed, but everyone at SSI believes achieving this milestone necessary for the development of a spaceplane which will need to fly far faster than Mach 3 to be successful.
		#loc_GAP_SSI_Mach3_synopsis = Launch an airplane from the runway, fly between 2,500m and 25,000m, exceed 1029 m/s in level flight for 5 seconds, and then land back at KSC safely.
		#loc_GAP_SSI_Mach3_notes = Mach 3 is definitely not cool. IN fact, it's the threshold of the flames of fire. The aerodynamic forces attacking your plane will be relentless, and unforgiving. Send a brave pilot who you know will keep his cool in flight.
		#loc_GAP_SSI_Mach3_completedMessage = Incredible! You have achieved Mach 3!\n\nInigma Kerman says this flight brings the spaceplane program one crucial step toward reality, and also comes with some significant funds from the Kerbal Space Program who will benefit from your flight data.
		#loc_GAP_SSI_Mach3_PARAMETER2_title_2 = achieve Mach 3
		#loc_GAP_SSI_Mach3_PARAMETER2_PARAMETER1_title = fly between 2500m and 25,000m
		#loc_GAP_SSI_Mach3_PARAMETER2_PARAMETER2_title_2 = fly faster than 1029 m/s

		//==================== Milestones/SSI-Mach4.cfg ====================

		#loc_GAP_SSI_Mach4_title = Achieve Mach 4!
		#loc_GAP_SSI_Mach4_description = Gene Kerman wants to see if SSI Aerospace and your organization can pull off the final leg of the air speed program, and gather data for aircraft thermal effects and handling of an aircraft at high supersonic speed. What speed? Mach 4. Inigma Kerman told Gene that SSI and its partners can do it. He wants you to take up this final airspeed challenge and see if you can get an aircraft to achieve Mach 4 flying above 2,500m but below 35,000m, in level flight. If it can be done, then it opens the door to developing a spaceplane prototype in the near future.
		#loc_GAP_SSI_Mach4_synopsis = Launch an airplane from the runway, fly between 2,500m and 25,000m, exceed 1372 m/s in level flight for 5 seconds, and then land and stop anywhere safely.
		#loc_GAP_SSI_Mach4_notes = Four times the speed of sound doesn't sound...er seem that much more than three times the speed of sound. That is, unless you're a meteor, which at some point in this mission someone on the ground might mistake you for one. Good luck!
		#loc_GAP_SSI_Mach4_completedMessage = Congratulations! You have achieved Mach 4!\n\nGene says the Kerbal Space Program and its affiliates are serious about reaching space via a spaceplane, and will look to SSI and to your organization to make it happen soon.
		#loc_GAP_SSI_Mach4_PARAMETER2_title_2 = achieve Mach 4
		#loc_GAP_SSI_Mach4_PARAMETER2_PARAMETER1_title = fly between 2500m and 35,000m
		#loc_GAP_SSI_Mach4_PARAMETER2_PARAMETER2_title_2 = fly faster than 1372 m/s

		//==================== Milestones/Wright-2500m.cfg ====================

		#loc_GAP_Wright_2500m_title = Fly an airplane to 2,500m.
		#loc_GAP_Wright_2500m_description = Taking off and landing is easy. Flying up to 2,500m with an air-breathing engine and landing back at the runway... is an entirely different matter. Wilbur Kerman says runways are the roads of the future, and says your pilots might as well get used to landing on one.
		#loc_GAP_Wright_2500m_synopsis = Simply launch an airplane from the runway, fly up to 2,500m, then land back at the runway safely.
		#loc_GAP_Wright_2500m_notes = Enjoy the view!
		#loc_GAP_Wright_2500m_completedMessage = Another historic flight completed!\n\nYour pilot is starting to showing some amazing skill with that last landing.
		#loc_GAP_Wright_2500m_PARAMETER2_title_2 = fly up to 2,500m

		//==================== Milestones/Wright-5000m.cfg ====================

		#loc_GAP_Wright_5000m_title = Fly an airplane to 5,000m.
		#loc_GAP_Wright_5000m_description = Orville Kerman says it should be possible now to attempt an altitude record of 5,000m in an air-breathing airplane. He said Wright Aeronautical is aware that a local newspaper is offering a reward to any organization that will be the first to achieve a 5,000m flying altitude, and he thinks your organization may be up to the task.
		#loc_GAP_Wright_5000m_synopsis = Simply launch an airplane from the runway, fly up to 5,000m, then land back at KSC safely.
		#loc_GAP_Wright_5000m_notes = Enjoy the view, as at this altitude things on the ground really start to look small!
		#loc_GAP_Wright_5000m_completedMessage = 5,000m and you didn't hit a bird! Great job!\n\nUnfortunatley, hitting a bird was what the last pilot to attempt this challenge said before he spiraled out of control from 4,500m and left a crater near the Administration Building.\n\nAs Gene Kerman makes preparations to turn the crater into a memorial pond for aviation pioneers, both Orville Kerman and Inigma Kerman congratulate you on returning safely. Inigma says GAP has a challenge waiting for you back at Mission Control if you're interested.
		#loc_GAP_Wright_5000m_PARAMETER2_title_2 = fly up to 5,000m

		//==================== Milestones/Wright-FirstFlight.cfg ====================

		#loc_GAP_Wright_FirstFlight_title = Build and fly your first airplane!
		#loc_GAP_Wright_FirstFlight_description = Thanks to your organization's research efforts, we have finally developed an air-breathing engine that should be light enough to mount to a glider, making controlled powered air flight possible!\n\nPrevious attempts to use solid rockets for gliders often ended in disaster and a scarcity of willing volunteers.  Wright Aeronautical is asking you to partner with them to build and test a flying machine using an air breathing engine. Your flying machine must have wings so it can control its flight, and must be able to land safely.\n\nThis is a whole new frontier where many have failed before, so there isn't any investment money available to offer you at the moment. Wright Aeronautical is willing to cover labor costs, snacks, and notify the press, however, you will need to put forth your own funds to acquire the parts necessary for this project. If you succeed, your pilot will acquire both valuable flying skills and your organization will become known worldwide.
		#loc_GAP_Wright_FirstFlight_synopsis = It's time to construct a flying machine - one that will prove to the world that controlled powered air flight is indeed possible!
		#loc_GAP_Wright_FirstFlight_notes = Wilbur and Orville both wanted to go, but the coin they flipped landed on its side - hence the reason why they're also asking you to put up a volunteer to pilot the contraption.
		#loc_GAP_Wright_FirstFlight_completedMessage = Congratulations! The flight was a success!\n\nThe historic flight was thankfully caught on camera by the lone press agent who responded to the press invitation. His article about your flight has been read by millions, and you have now spurred the imaginations of Kerbals everywhere.
		#loc_GAP_Wright_FirstFlight_PARAMETER1_title = Your flying machine must

		//==================== Milestones/Wright-Glider.cfg ====================

		#loc_GAP_Wright_Glider_title = Build and fly a glider!
		#loc_GAP_Wright_Glider_description = Wilbur and Orville Kerman have been overseeing GAP's flying machine project and have formed a new venture company called Wright Aeronautical to explore the frontiers of powered air flight. To get started, they want you to develop a prototype gilder to test a few flight control concepts. Your glider must have a command seat, wings to control its flight, and be able to land safely.\n\nGetting the glider up into the air is up to your imagination, however Jebediah Kerman recommends the tried and true solid rocket approach. That or jumping off a cliff. Your choice. Whatever you decide to do, just make sure your pilot survives as we don't want any bad publicity this early into our program. To be counted as a true glider, you will need to decouple any boosters you decide to use.
		#loc_GAP_Wright_Glider_synopsis = Making a glider isn't that hard. Getting it up off the ground, however, will present a challenge.
		#loc_GAP_Wright_Glider_notes = Jebediah hints that if you decide to go with a solid rocket launch assist, that you include a means to decouple the solid rockets for a smoother flight.
		#loc_GAP_Wright_Glider_completedMessage = The glider flight test was a success!\n\nThe fact that you landed safely is even more amazing.
		#loc_GAP_Wright_Glider_PARAMETER1_title = Your glider must
		#loc_GAP_Wright_Glider_PARAMETER1_PARAMETER2_title_2 = have a command seat
		#loc_GAP_Wright_Glider_PARAMETER1_PARAMETER4_title_4 = not have any engines after launch

		//==================== Milestones/Wright-Speed100.cfg ====================

		#loc_GAP_Wright_Speed100_title = Achieve an airspeed of 100 m/s
		#loc_GAP_Wright_Speed100_description = Kurtis Kerman, a friend of Wilbur Kerman, suggests that an airplane, if designed properly, should be able to exceed speeds faster than the fastest ground vehicles, and without having to dive toward the ground to do it. Wright Aeronautical is interested in helping to prove that this is possible (we're hoping you know which \"this\" we're referring to). They want you to take an air-breathing airplane above 2,500m but below 5,000m and see if you can exceed 100 m/s safely in level controlled flight, and thus break the current manned vehicle speed record.
		#loc_GAP_Wright_Speed100_synopsis = Simply launch an airplane from the runway, fly between 2,500m and 5,000m, exceed 220 m/s in level flight for 5 seconds, and then land back at KSC safely.
		#loc_GAP_Wright_Speed100_completedMessage = Congratulations, you have set a new air speed record of 100 m/s!\n\nYou have justified Kurtis Kerman's theories on high speed air flight, and brought another measure of fame and reputation to Wright Aeronautical. Sponsors are starting to ask how they can support the new air speed frontier. Check in with Mission Control to see if Wright Aeronautical has another contract waiting for you!
		#loc_GAP_Wright_Speed100_PARAMETER2_title_2 = achieve a maximum airspeed of 100 m/s
		#loc_GAP_Wright_Speed100_PARAMETER2_PARAMETER2_title_2 = fly faster than 100 m/s

		//==================== Milestones/Wright-Speed220.cfg ====================

		#loc_GAP_Wright_Speed220_title = Achieve an airspeed of 220 m/s
		#loc_GAP_Wright_Speed220_description = Kurtis Kerman, now a fellow engineer with Wright Aeronautical, thinks that with additional tweaking of existing aircraft design, that it may be possible to exceed 220 m/s in level flight. A number of sponsors have given GAP some money to make it happen, and Inigma Kerman is more than happy to funnel all of it to Wright Aeronautical and on to your organization if you accept this contract!\n\nAttempting high speed flying though is not for the faint of heart. Some pilots have reported serious shimmies with their aircraft when approaching high speeds during dives, and some airplanes have broken up due to aerodynamic forces when exceeding 220 m/s. Inigma wants you to be the first to take an air-breathing airplane above 2,500m but below 5,000m and exceed 220 m/s in level controlled flight, and return safely. Doing so will give the sponsors a pretty decent return on their investment and funds in your pocket.
		#loc_GAP_Wright_Speed220_synopsis = Simply launch an airplane from the runway, fly between 2,500m and 5,000m, exceed 220 m/s in level flight for 5 seconds, and then land back at KSC safely.
		#loc_GAP_Wright_Speed220_completedMessage = Congratulations, you have set a new airspeed record of 220 m/s and returned alive!\n\nYour success in meeting Wright Aeronautical airspeed challenges has Inigma Kerman calling for you to see if you can help GAP surmount one of the most daring airspeed challenges ever conceived. Check in with Mission Control for details.
		#loc_GAP_Wright_Speed220_PARAMETER2_title_2 = achieve a maximum airspeed of 220 m/s
		#loc_GAP_Wright_Speed220_PARAMETER2_PARAMETER2_title_2 = fly faster than 220 m/s

		//==================== Rescue/CoastGuard-RescueClimbers-Easy.cfg ====================

		#loc_GAP_CoastGuard_RescueClimbers_Easy_title = Medevac: Rescue climbers near K2 (Easy)
		#loc_GAP_CoastGuard_RescueClimbers_Easy_description = The KSC Coast Guard has received an emergency call from the Kerbin Peak Mountain Trail Ranger Station.\n\nTwo mountain climbers are reported stranded on opposite summits of the K2 mountain range after they got in an arguement as to which way up K2 was the correct way. Apparently one climber has a rope, the other has hooks, and now they are both in need of a rescue. Send out a Search and Rescue team to rescue the climbers, and return them to a Coast Guard landing area for a safe recovery. Lt. Dan Kerman has assigned expert mountaineer Ens. Joe Kerman, to this mission to assist in the recovery of the climbers.
		#loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s1 = Rescue climbers 
		#loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s2 =  and 
		#loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s3 =  from their respective locations in the K2 mountains, and bring them to any KSC Coast Guard rescue station for a safe recovery.
		#loc_GAP_CoastGuard_RescueClimbers_Easy_completedMessage = KSC Coast Guard rescue mission accomplished!\n\nThe climbers were retrieved from the mountain safely. They promise to stick together again next time.
		#loc_GAP_PQS_CITY_K2_Summit_name = K2 Summit
		#loc_GAP_CoastGuard_RescueClimbers_Easy_PARAMETER1_PARAMETER2_title_2 = have at least 3 passenger seats
		#loc_GAP_CoastGuard_RescueClimbers_Easy_PARAMETER3_title_3 = rescue climbers

		//==================== Rescue/CoastGuard-RescuePilot.cfg ====================

		#loc_GAP_CoastGuard_RescuePilot_title_s1 = Mayday: 
		#loc_GAP_CoastGuard_RescuePilot_genericTitle = Mayday: Rescue Pilot
		#loc_GAP_CoastGuard_RescuePilot_description_s1 = The KSC Coast Guard received a mayday from 
		#loc_GAP_CoastGuard_RescuePilot_description_s2 =  who reported trouble with his plane and had to eject. Send out a Search and Rescue team to save the pilot and return him to a Coast Guard landing area for a safe recovery.
		#loc_GAP_CoastGuard_RescuePilot_genericDescription = The KSC Coast Guard received a mayday from a pilot who reported trouble with his plane and had to eject. Send out a Search and Rescue team to save the pilot and return him to a Coast Guard landing area for a safe recovery.
		#loc_GAP_CoastGuard_RescuePilot_notes_s1 = Rescue 
		#loc_GAP_CoastGuard_RescuePilot_notes_s2 =  and bring them to any KSC Coast Guard rescue station for a safe recovery.
		#loc_GAP_CoastGuard_RescuePilot_completedMessage_s1 = KSC Coast Guard rescue mission accomplished!\n\n
		#loc_GAP_CoastGuard_RescuePilot_completedMessage_s2 =  was retrieved from the area with minimal injury. Your successful operation hasn't gone unnoticed by the Kerbal Space Program. Check in with Mission Control for your next mission.
		#loc_GAP_PQS_CITY_KSC_Sea_North_Central_Waypoint_name = KSC Sea North Central Waypoint
