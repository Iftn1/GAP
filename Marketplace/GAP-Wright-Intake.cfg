//GAP-Wright-Intake - GAP: Purchase air intake tech.

CONTRACT_TYPE
{


//REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = Funds
		type = Funds
		
		minFunds = @/membershipBalance
		
	}
	
	REQUIREMENT
	{
		name = PartUnlocked
		type = PartUnlocked
		
		part = miniIntake
		
		invertRequirement = true

	}


//DATA NODES TO PROCESS FOR CONTRACT USE

	DATA
	{
		name = double
		type = double
		
		membershipBalance = Round(StartingFunds() * 0.08)
		productionCost = 0 - @membershipBalance
		
	}

//CONTRACT DESCRIPTION

	name = GAP-Wright-Intake
	title = #loc_GAP_GAP_Wright_Intake_title
	group = Prototype Marketplace
	agent = Giving Aircraft a Purpose
	
	description = #loc_GAP_GAP_Wright_Intake_description
	
	synopsis = #loc_GAP_GAP_Wright_Intake_synopsis
	
	notes = #loc_GAP_GAP_Wright_Intake_notes
	
	completedMessage = #loc_GAP_GAP_Wright_Intake_completedMessage
	
//Contract Limits
   	maxCompletions = 1
   	maxSimultaneous = 1
//	weight = 40.0

	autoAccept = false
	declinable = true
	cancellable = true

	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
   	targetBody = Kerbin

//Contract Rewards
  	advanceFunds = 0.0
	rewardFunds = @/productionCost
	rewardReputation = 0.0
 	rewardScience = 0.0
	
//Contract Penalties
  	failureFunds = 0.0
 	failureReputation = 0.0


//BEHAVIOURS TO DO WHEN CREATING CONTRACT

	BEHAVIOUR
	{
		name = ExperimentalPart
		type = ExperimentalPart

		part = miniIntake
		
		unlockCriteria = CONTRACT_ACCEPTANCE
		lockCriteria = DO_NOT_LOCK

	}
	

//PARAMETERS FOR CONTRACT COMPLETION

	PARAMETER
	{
		name = Timer
		type = Timer
		
		duration = 1s
		
		timerType = CONTRACT_ACCEPTANCE	
		
		failContract = false
	
	}
	
}