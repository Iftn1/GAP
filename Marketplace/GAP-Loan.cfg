//GAP-Loan - GAP Marketplace: Venture Capital Funding Loan: 20k

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_GAP_GAP_Loan_description_s1 = #loc_GAP_GAP_Loan_description_s1
		loc_GAP_GAP_Loan_description_s2 = #loc_GAP_GAP_Loan_description_s2
		loc_GAP_GAP_Loan_description_s3 = #loc_GAP_GAP_Loan_description_s3
		loc_GAP_GAP_Loan_description_s4 = #loc_GAP_GAP_Loan_description_s4
		loc_GAP_GAP_Loan_description_s5 = #loc_GAP_GAP_Loan_description_s5
		loc_GAP_GAP_Loan_description_s6 = #loc_GAP_GAP_Loan_description_s6
		loc_GAP_GAP_Loan_description_s7 = #loc_GAP_GAP_Loan_description_s7
		loc_GAP_GAP_Loan_notes_s1 = #loc_GAP_GAP_Loan_notes_s1
		loc_GAP_GAP_Loan_notes_s2 = #loc_GAP_GAP_Loan_notes_s2
		loc_GAP_GAP_Loan_completedMessage_s1 = #loc_GAP_GAP_Loan_completedMessage_s1
		loc_GAP_GAP_Loan_completedMessage_s2 = #loc_GAP_GAP_Loan_completedMessage_s2
		loc_GAP_GAP_Loan_completedMessage_s3 = #loc_GAP_GAP_Loan_completedMessage_s3
		loc_GAP_GAP_Loan_completedMessage_s4 = #loc_GAP_GAP_Loan_completedMessage_s4
		loc_GAP_GAP_Loan_completedMessage_s5 = #loc_GAP_GAP_Loan_completedMessage_s5
		loc_GAP_GAP_Loan_PARAMETER1_waitingText_s1 = #loc_GAP_GAP_Loan_PARAMETER1_waitingText_s1
		loc_GAP_GAP_Loan_PARAMETER1_waitingText_s2 = #loc_GAP_GAP_Loan_PARAMETER1_waitingText_s2
	}


	sortKey = a2

//REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		type = Funds
		
		maxFunds = @/playerBalanceThreshold
		
	}


//DATA NODES TO PROCESS FOR CONTRACT USE

	DATA
	{
		type = double

//Offer contract when balance is 25% of original starting funds
		playerBalanceThreshold = Round( StartingFunds() * 0.25 )

//Loan amount
		principal = 20000
		interest = 0.35
		period = 30
		
		posInterest = @interest * 100
		interestPayment = Round( @principal * @interest )
		negPayment = 0 - Round( @principal + (@principal * @interest) )
		posPayment = @principal + @interestPayment

		
	}
	

//CONTRACT DESCRIPTION

	name = GAP-Loan
	title = #loc_GAP_GAP_Loan_title
	group = Prototype Marketplace
	agent = Giving Aircraft a Purpose
	
	description = @/loc_GAP_GAP_Loan_description_s1 + @/principal.Print() + @/loc_GAP_GAP_Loan_description_s2 + @/period + @/loc_GAP_GAP_Loan_description_s3 + @/posInterest + @/loc_GAP_GAP_Loan_description_s4 + @/interestPayment.Print() + @/loc_GAP_GAP_Loan_description_s5 + @/period + @/loc_GAP_GAP_Loan_description_s6 + @/posPayment.Print() + @/loc_GAP_GAP_Loan_description_s7
	
	synopsis = #loc_GAP_GAP_Loan_synopsis
	
	notes = @/loc_GAP_GAP_Loan_notes_s1 + @/period + @/loc_GAP_GAP_Loan_notes_s2
	
	completedMessage = @/loc_GAP_GAP_Loan_completedMessage_s1 + @/principal.Print() + @/loc_GAP_GAP_Loan_completedMessage_s2 + @/posInterest + @/loc_GAP_GAP_Loan_completedMessage_s3 + @/interestPayment.Print() + @/loc_GAP_GAP_Loan_completedMessage_s4 + @/period + @/loc_GAP_GAP_Loan_completedMessage_s5
	
//Contract Limits
   	maxCompletions = 0
   	maxSimultaneous = 1
//	weight = 100.0

	autoAccept = false
	declinable = true
	cancellable = true

	minExpiry = 7.0
	maxExpiry = 7.0
	deadline = 0

//Contract Reward Modifiers
	prestige = Trivial
   	targetBody = Kerbin

//Contract Rewards
  	advanceFunds = @/principal
	rewardFunds = @/negPayment
	rewardReputation = 0.0
 	rewardScience = 0.0
	
//Contract Penalties
  	failureFunds = @/interestPayment
 	failureReputation = 0.0


//PARAMETERS FOR CONTRACT COMPLETION

	PARAMETER
	{
		name = Duration
		type = Duration
		
		duration = 30d
		preWaitText = #loc_GAP_GAP_Loan_PARAMETER1_preWaitText
		waitingText =  @/loc_GAP_GAP_Loan_PARAMETER1_waitingText_s1 + @/posPayment.Print() + @/loc_GAP_GAP_Loan_PARAMETER1_waitingText_s2
		completionText = #loc_GAP_GAP_Loan_PARAMETER1_completionText
		
	}

}