//CoastGuard-RescueClimbers-Easy - KSC Coast Guard: Medevac: Rescue climbers near K2 (Easy)

CONTRACT_TYPE
{

	DATA
	{
		type = string
		hidden = true

		loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s1 = #loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s1
		loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s2 = #loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s2
		loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s3 = #loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s3
	}


	sortKey = 20

//REQUIREMENTS FOR CONTRACT TO APPEAR

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract

		contractType = GAP-Helicopter
		minCount = 1
		
	}
	
	
//DATA NODES TO PROCESS FOR CONTRACT USE

//Contract Specific VesselParameterGroup Definition Key (to prevent conflict with other active contracts)
	DATA
	{
		type = string
		
		craft = GAPcraftCoastGuardRescueClimbersEasy
		
	}

//List of Coast Guard Team Members
	DATA
	{
		type = List<Kerbal>
		
		kerbalsCoastGuard = [ NewKerbal( Male , "Ens. Joe Kerman" , "Pilot") ]
		
		hidden = true
		
	}
	
//List of Kerbals in Distress
	DATA
	{
		type = List<Kerbal>
		
		kerbalsInDistress = NewKerbals(2)
		
		hidden = true
	
	}

//CONTRACT DESCRIPTION

	name = CoastGuard-RescueClimbers-Easy
	title = #loc_GAP_CoastGuard_RescueClimbers_Easy_title
	group = KSC Coast Guard
	agent = KSC Coast Guard

	description = #loc_GAP_CoastGuard_RescueClimbers_Easy_description

	synopsis = #loc_GAP_shared_KSC_Coast_Guard_Our_motto_is_Always_Ready_Kemper

	notes = @/loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s1 + @/kerbalsInDistress.ElementAt(0) + @/loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s2 + @/kerbalsInDistress.ElementAt(1) + @/loc_GAP_CoastGuard_RescueClimbers_Easy_notes_s3

	completedMessage = #loc_GAP_CoastGuard_RescueClimbers_Easy_completedMessage

//Contract Limits
	maxCompletions = 0
	maxSimultaneous = 1
//	weight = 10.0

	autoAccept = false
	declinable = true
	cancellable = true

	minExpiry = 1.0
	maxExpiry = 1.0
	deadline = 1

//Contract Reward Modifiers
	prestige = Trivial
	targetBody = Kerbin
	
//Contract Rewards
  	advanceFunds = 4000.0
	rewardFunds = 16000.0
  	rewardReputation = 25.0
 	rewardScience = 0.0
	
//Contract Penalties
  	failureFunds = 2000.0
	failureReputation = 50.0


//BEHAVIOURS TO DO WHEN CREATING CONTRACT
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		
		kerbal = @/kerbalsCoastGuard.ElementAt(0)
		kerbalType = Crew
		
	}

	BEHAVIOUR
	{
		name = SpawnKerbal
		type = SpawnKerbal

		KERBAL
		{
			kerbal = @/kerbalsInDistress.ElementAt(0)
			kerbalType = Unowned
			owned = false
			addToRoster = false
			
			lat = -0.470841034183513
			lon = -79.372623606542
			alt = 5566
			heading = 100
			
		}

		KERBAL
		{
			kerbal = @/kerbalsInDistress.ElementAt(1)
			kerbalType = Unowned
			owned = false
			addToRoster = false
			
			lat = 0.0476814747521012
			lon = -79.3421581390992
			alt = 4793
			heading = 90
			
		}
		
	}
 
	BEHAVIOUR
	{
		name = DistressLocation
		type = WaypointGenerator

		PQS_CITY
		{
			name = #loc_GAP_PQS_CITY_K2_Summit_name
			icon = marker
			
			targetBody = Kerbin
			pqsCity = KSC
			pqsOffset = -50307.2026680623, 1205.00213511309, 3268.52097521383
			
			hidden = true
		
		}
		
		//Random Waypoint Within Random Rescue Area
		RANDOM_WAYPOINT_NEAR
		{
		
			name = K2 Summit Search Area
			icon = marker
			
			targetBody = Kerbin
			nearIndex = 0
			maxDistance = 5000.0
			altitude = 4000
		
		}
		
	}

	
//PARAMETERS FOR CONTRACT COMPLETION

//Craft definition
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_shared_Your_craft_must
		
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = HasCrew
			type = HasCrew
			title = #loc_GAP_shared_have_a_Kerbal_in_command
			
			minCrew = 1
		
			disableOnStateChange = false
			hideChildren = true

		}
		
		PARAMETER
		{
			name = HasCrewCapacity
			type = HasCrewCapacity
			title = #loc_GAP_CoastGuard_RescueClimbers_Easy_PARAMETER1_PARAMETER2_title_2
			
			minCapacity = 4
			
			disableOnStateChange = false
			
		}
		
	//Passenger Manifest - Load Passengers
		PARAMETER
		{
			name = All
			type = All
			
			title = #loc_GAP_shared_load_your_Coast_Guard_rescue_officer
			
			PARAMETER
			{
				name = HasPassengers
				type = HasPassengers
				title = @kerbal.First()
		
				ITERATOR
				{
					type = Kerbal
					kerbal = @/kerbalsCoastGuard
					
				}
				
				hideChildren = true
				
			}

		}
		
		disableOnStateChange = false

	}

//Contract Goals
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = #loc_GAP_shared_fly_to_the_search_area
		
		vessel = @/craft
		
		PARAMETER
		{
			name = VisitWaypoint
			type = VisitWaypoint
			
			index = 1
			distance = 5000
			hideOnCompletion = true
			
			disableOnStateChange = true
			hideChildren = true
			
		}

		disableOnStateChange = true
		hideChildren = true
		
	}

	PARAMETER
	{
		name = HasCrew
		type = HasCrew
		title =  #loc_GAP_CoastGuard_RescueClimbers_Easy_PARAMETER3_title_3
		
		kerbal = @/kerbalsInDistress

		completeInSequence = true
		disableOnStateChange = false
	
	}

//Recovery Parameter - Landing
	PARAMETER
	{
		name = Any
		type = Any
		title = #loc_GAP_shared_and_then_land_and_stop
		
		PARAMETER
		{
			name = Any
			type = Any
			title = #loc_GAP_shared_at_one_of_the_following_recovery_areas
			
			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = #loc_GAP_shared_the_KSC_Runway
				
				vessel = @/craft

				PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = Runway
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}
				
				disableOnStateChange = false
				hideChildren = true

			}
			
			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = #loc_GAP_shared_the_Vehicle_Assembly_Building_Helipad
				
				vessel = @/craft
				
				REQUIREMENT
				{
					name = CompleteContract
					type = CompleteContract

					contractType = GAP-Helicopter
					minCount = 1
					
				}

				PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = VAB Main Building
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}
				
				disableOnStateChange = false
				hideChildren = true		

			}
			
			PARAMETER
			{
				name = VesselParameterGroup
				type = VesselParameterGroup
				title = #loc_GAP_shared_or_the_Spaceplane_Hangar_Air_Terminal
				
				vessel = @/craft

				PARAMETER
				{
					name = ReachState
					type = ReachState
					
					targetBody = Kerbin
					biome = SPH
					situation = LANDED
					maxSpeed = 0.0

					disableOnStateChange = false
					hideChildren = true

				}
				
				disableOnStateChange = false
				hideChildren = true

			}
			
			completeInSequence = true
			disableOnStateChange = false
		
		}
		
		completeInSequence = true
		disableOnStateChange = false

	}

//Recovery Parameter - Craft & Kerbal Safety Check
	PARAMETER
	{
		name = All
		type = All
		title = #loc_GAP_shared_safely
		
		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = #loc_GAP_shared_without_destroying_your_aircraft
			
			vessel = @/craft

		}
		
		PARAMETER
		{
			name = All
			type = All
			title = #loc_GAP_shared_or_killing_anyone
			
			PARAMETER
			{
				name = KerbalDeaths
				type = KerbalDeaths
				title = #loc_GAP_shared_or_killing_your_crew
				
				vessel = @/craft
				
				hideChildren = true

			}
			
			PARAMETER
			{
				name = KerbalDeaths
				type = KerbalDeaths
				title = #loc_GAP_shared_or_killing_anyone_you_need_to_rescue
		
				kerbal = @/kerbalsInDistress
				
				hideChildren = true
				
			}
			
			disableOnStateChange = false
			hideChildren = true
		
		}
		
		completeInSequence = true
		disableOnStateChange = true
		
	}
	
//Recovery Parameter - Recover Kerbals
	PARAMETER
	{
		name = All
		type = All
		title = #loc_GAP_shared_and_recover
		
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			title = @kerbal.First()
	
			ITERATOR
			{
				type = Kerbal
				kerbal = @/kerbalsCoastGuard
				
			}
			
			hideChildren = true
			
		}
		
		PARAMETER
		{
			name = RecoverKerbal
			type = RecoverKerbal
			title = @kerbal.First()
	
			ITERATOR
			{
				type = Kerbal
				kerbal = @/kerbalsInDistress
				
			}
			
			hideChildren = true
			
		}
		
	}
	
}